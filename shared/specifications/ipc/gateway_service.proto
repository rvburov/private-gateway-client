// Связь интерфейса (процесс пользователя) с привилегированной службой Private Gateway.
//
// Транспорт — gRPC по локальному каналу, в сеть служба не слушает:
//   Windows — named pipe «PrivateGateway.Ipc.v1»;
//   Linux   — Unix-сокет /run/private-gateway/ipc.sock;
//   macOS   — Unix-сокет службы (вариант решается на спайке macOS).
// Доступ к каналу — только у пользователя, установившего службу, и у администраторов.
//
// Правило безопасности: служба не принимает готовый конфиг ядра, пути к файлам и команды.
// Только описание сервера и настройки — конфиг Xray/sing-box служба собирает и проверяет сама.
// Иначе любой процесс пользователя смог бы через службу писать файлы с правами администратора.
//
// Версия контракта — в имени пакета (v1). Несовместимое изменение — новый пакет v2,
// v1 служба поддерживает, пока интерфейс старой версии может с ней встретиться.

syntax = "proto3";

package privategateway.ipc.v1;

option csharp_namespace = "PrivateGateway.Client.Contracts.V1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

service GatewayService {
  // Версии службы, контракта и ядер. Интерфейс вызывает первым и сверяет api_version.
  rpc GetServiceInfo(GetServiceInfoRequest) returns (ServiceInfo);

  // Текущее состояние и поток его изменений (главный экран, трей, уведомления).
  rpc GetStatus(GetStatusRequest) returns (Status);
  rpc WatchStatus(WatchStatusRequest) returns (stream Status);

  rpc Connect(ConnectRequest) returns (ConnectReply);
  rpc Disconnect(DisconnectRequest) returns (DisconnectReply);

  // Не используется: настройки на ходу окно применяет повторным Connect к тому же серверу
  // (служба меняет подключение без щели). Служба принимает вызов и ничего не меняет.
  rpc ApplyProtection(ProtectionSettings) returns (ApplyProtectionReply);

  // Пауза защиты для входа в Wi-Fi отеля или кафе — только на время, с обратным отсчетом. Бывает в
  // CONNECTED, в BLOCKED (строгий режим, блок с загрузки или с прошлого запуска), в CONNECTING и
  // RECONNECTING (попытки стоят до конца паузы, потом подключение заново) и в ERROR, где сеть закрыта; в
  // BLOCKED без подключения по окончании возвращается тот же блок, без подключения. Паузы нет — ответ без
  // срока.
  rpc PauseForCaptivePortal(CaptivePauseRequest) returns (CaptivePauseReply);

  // Экран «Проверка»: проверки утечек и журнал службы (уже без секретов).
  rpc RunChecks(RunChecksRequest) returns (CheckReport);
  rpc WatchLog(WatchLogRequest) returns (stream LogEntry);

  // Пинг серверов меряет служба: в интерфейсе сеть запрещена.
  rpc MeasureLatency(MeasureLatencyRequest) returns (MeasureLatencyReply);

  // Обновление программы ищет служба (в интерфейсе сеть запрещена): выпуски на GitHub канала окна, подпись
  // манифеста — ключом программы, доля раскатки — номером этой установки. Ответ служба помнит час; force — искать
  // заново (кнопка «Проверить»).
  rpc CheckForUpdate(CheckForUpdateRequest) returns (UpdateOffer);

  // Скачать найденное обновление: файл своей ОС из подписанного манифеста — в папку состояния службы, со сверкой
  // размера и SHA-256. Поток — ход загрузки, последнее сообщение — готово или отказ. Версия — только та, что служба
  // сама нашла (CheckForUpdate); путь и адрес окно не передает.
  rpc DownloadUpdate(DownloadUpdateRequest) returns (stream UpdateDownload);

  // Поставить скачанное обновление: служба сверяет файл еще раз и запускает установщик ОС отдельно от себя (он заменит
  // и ее), ответ — номер процесса установщика: окно ждет его конца и открывается заново. Откат на прежнюю версию
  // (UpdateOffer.rollback) — те же DownloadUpdate и InstallUpdate с ее номером.
  rpc InstallUpdate(InstallUpdateRequest) returns (InstallUpdateReply);

  // Сетевой инспектор: адаптеры, адреса, шлюзы, DNS, DHCP и маршруты машины — только читает, ничего не меняет.
  rpc InspectNetwork(InspectNetworkRequest) returns (NetworkSnapshot);

  // Что известно об адресе в интернете: автономная система, владелец, сеть (RIPEstat) и примерное место (MaxMind GeoLite2
  // через RIPEstat). Только IP — имя служба не принимает (INVALID_ARGUMENT); о частном адресе — ответ без запроса. Об адресе
  // выхода режима прокси служба спрашивает через ядро, об остальных — обычным путем (в режиме VPN — через туннель). Ответ
  // служба помнит час.
  rpc DescribeAddress(DescribeAddressRequest) returns (AddressInfo);

  // Внешний IP по кнопке инспектора: под защитой — адрес выхода (как проверка exit_ip), защита выключена или на паузе —
  // реальный, прямым путем. Итог — в Status.exit (WatchStatus); подключение, блокировка и ошибка — ничего не меряет.
  rpc MeasureIp(MeasureIpRequest) returns (MeasureIpReply);

  // Замер инспектора до узла, который назвал пользователь: пинг, трассировка, поиск имени, TCP, TLS. Узел — IP или имя
  // хоста (другое — INVALID_ARGUMENT), порт — для TCP и TLS. Поток — по строке на эхо, участок трассировки или адрес
  // имени; у TCP и TLS — одна строка. Замер идет как вся сеть службы (в режиме VPN — в туннель) и ничего не меняет.
  rpc RunProbe(ProbeRequest) returns (stream ProbeStep);

  // Сокеты TCP и UDP машины с процессами — по возможностям ОС (Windows — IP Helper, Linux — /proc, macOS — lsof); чужие
  // процессы видны только установленной службе. Только чтение; адреса в журнал не пишутся.
  rpc ListConnections(ListConnectionsRequest) returns (ConnectionList);

  // Счетчики трафика включенных адаптеров раз в секунду, пока окно слушает: скорость окно считает по соседним.
  rpc WatchTraffic(WatchTrafficRequest) returns (stream TrafficSample);
}

// ── Состояние ───────────────────────────────────────────────────────────────

enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  CONNECTION_STATE_OFF = 1;
  CONNECTION_STATE_CONNECTING = 2;
  CONNECTION_STATE_CONNECTED = 3;
  CONNECTION_STATE_RECONNECTING = 4;
  CONNECTION_STATE_BLOCKED = 5;
  CONNECTION_STATE_ERROR = 6;
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  // Весь трафик системы через TUN.
  MODE_VPN = 1;
  // Только системный прокси: часть программ идет мимо, блок при обрыве недоступен.
  MODE_PROXY = 2;
}

// Состояние одной проверки (чипы главного экрана и строки экрана «Проверка»).
enum CheckState {
  CHECK_STATE_UNSPECIFIED = 0;
  CHECK_STATE_OK = 1;
  CHECK_STATE_WAITING = 2;
  CHECK_STATE_STOPPED = 3;
  CHECK_STATE_OFF = 4;
  CHECK_STATE_WARNING = 5;
}

message Status {
  ConnectionState state = 1;
  Mode mode = 2;
  string server_id = 3;
  // Когда наступило текущее состояние (таймер «в сети»).
  google.protobuf.Timestamp since = 4;
  // Номер попытки при переподключении.
  int32 attempt = 5;
  ProtectionStatus protection = 6;
  TrafficStats traffic = 7;
  ExitInfo exit = 8;
  ErrorInfo error = 9;
  // Пауза для входа в Wi-Fi (в CONNECTED, BLOCKED, CONNECTING, RECONNECTING или ERROR); не задана — паузы нет.
  google.protobuf.Timestamp captive_pause_until = 10;
  // Сеть машины — строка под заголовком на главном экране.
  NetworkInfo network = 11;
  // «Блокировка» строгого режима: защиту выключили вручную, сеть закрыта до подключения
  // или выключения строгого режима. Бывает вместе с captive_pause_until — тогда сеть открыта
  // на время паузы и закроется снова.
  bool strict_block = 12;
  // Когда служба последний раз видела смену сети машины; не задано — с запуска службы не менялась.
  // Окно по нему понимает, что попытки идут сразу после смены Wi-Fi (уведомление «Нужен вход в Wi-Fi»).
  google.protobuf.Timestamp network_changed_at = 13;
}

enum NetworkKind {
  NETWORK_KIND_UNSPECIFIED = 0;
  NETWORK_KIND_NONE = 1;
  NETWORK_KIND_WIFI = 2;
  NETWORK_KIND_ETHERNET = 3;
  NETWORK_KIND_USB_MODEM = 4;
  NETWORK_KIND_MOBILE = 5;
}

message NetworkInfo {
  NetworkKind kind = 1;
  // Имя Wi-Fi, если ОС его отдает (на Windows 11 — с разрешением на геолокацию); иначе пусто.
  string name = 2;
  // Открытая сеть без пароля.
  bool is_open = 3;
  // Лимитная сеть (точка доступа с телефона).
  bool is_metered = 4;
}

message ProtectionStatus {
  CheckState all_traffic = 1;
  CheckState dns = 2;
  CheckState ipv6 = 3;
  CheckState kill_switch = 4;
  google.protobuf.Timestamp checked_at = 5;
  // IPv6 идет через туннель (сервер его открывает); false — IPv6 закрыт.
  bool ipv6_tunnel = 6;
}

message TrafficStats {
  int32 latency_ms = 1;
  double download_mbps = 2;
  double upload_mbps = 3;
  uint64 bytes_down = 4;
  uint64 bytes_up = 5;
}

// IP, который видят сайты, — измеренный службой, а не предполагаемый.
message ExitInfo {
  string ip = 1;
  string city = 2;
  // «дата-центр», «провайдер» и т. п.
  string network_type = 3;
  string asn = 4;
  // Адрес без VPN, измеренный до подключения.
  string direct_ip = 5;
  google.protobuf.Timestamp measured_at = 6;
}

message ErrorInfo {
  // Код из каталога ошибок, например PGC-SVC-002.
  string code = 1;
  // Текст без секретов, для журнала; интерфейс показывает свой перевод по коду.
  string message = 2;
}

// ── Подключение ─────────────────────────────────────────────────────────────

message ConnectRequest {
  ServerEndpoint server = 1;
  Mode mode = 2;
  ProtectionSettings protection = 3;
  RoutingSettings routing = 4;
  ConnectionSettings connection = 5;
  // Режим VPN: подключиться, хотя работает другой VPN (PGC-NET-010), — «Продолжить (не рекомендуется)».
  bool allow_other_vpn = 6;
}

// «Подключение и ядро» (доска 6): ядро, TUN, соединение, режим прокси.
message ConnectionSettings {
  CoreLogLevel core_log = 1;
  TunEngine tun_engine = 2;
  // 0 — MTU подбирает служба.
  uint32 mtu = 3;
  // Запретить обход туннеля через другие адаптеры.
  bool strict_routes = 4;
  // Определение домена — для правил маршрутизации по доменам.
  bool sniffing = 5;
  TlsFingerprint fingerprint = 6;
  bool mux = 7;
  bool tls_fragment = 8;
  google.protobuf.Duration connect_timeout = 9;
  // Переподключение — только к выбранному серверу.
  ReconnectPolicy reconnect = 10;
  // Локальный вход ядра HTTP + SOCKS5 (mixed) в режиме прокси.
  uint32 proxy_port = 11;
  bool proxy_allow_lan = 12;
  // Режим прокси: на время подключения включить системный прокси ОС (служба пользователя).
  bool system_proxy = 13;
}

enum CoreLogLevel {
  CORE_LOG_LEVEL_UNSPECIFIED = 0;
  CORE_LOG_LEVEL_WARNING = 1;
  CORE_LOG_LEVEL_INFO = 2;
  CORE_LOG_LEVEL_DEBUG = 3;
}

enum TunEngine {
  TUN_ENGINE_UNSPECIFIED = 0;
  TUN_ENGINE_SYSTEM = 1;
  TUN_ENGINE_GVISOR = 2;
  TUN_ENGINE_MIXED = 3;
}

enum TlsFingerprint {
  TLS_FINGERPRINT_UNSPECIFIED = 0;
  // Как в ссылке или подписке.
  TLS_FINGERPRINT_PROFILE = 1;
  TLS_FINGERPRINT_CHROME = 2;
  TLS_FINGERPRINT_FIREFOX = 3;
  TLS_FINGERPRINT_SAFARI = 4;
  TLS_FINGERPRINT_RANDOM = 5;
}

enum ReconnectPolicy {
  RECONNECT_POLICY_UNSPECIFIED = 0;
  RECONNECT_POLICY_BACKOFF_60S = 1;
  RECONNECT_POLICY_UP_TO_5_MINUTES = 2;
  RECONNECT_POLICY_NEVER = 3;
}

message ConnectReply {
  bool accepted = 1;
  ErrorInfo error = 2;
}

message DisconnectRequest {
  // Строгий режим («Защита и утечки»): выключить защиту, но оставить сеть закрытой — блок без туннеля,
  // «Блокировка». Действует только в режиме VPN с блоком при обрыве.
  bool keep_block = 1;
}
message DisconnectReply {}

enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_VLESS = 1;
  PROTOCOL_VMESS = 2;
  PROTOCOL_TROJAN = 3;
  PROTOCOL_SHADOWSOCKS = 4;
  PROTOCOL_HYSTERIA2 = 5;
  PROTOCOL_TUIC = 6;
  PROTOCOL_WIREGUARD = 7;
}

message ServerEndpoint {
  string id = 1;
  string name = 2;
  Protocol protocol = 3;
  string host = 4;
  uint32 port = 5;
  Transport transport = 6;
  Security security = 7;

  oneof settings {
    VlessSettings vless = 10;
    VmessSettings vmess = 11;
    TrojanSettings trojan = 12;
    ShadowsocksSettings shadowsocks = 13;
    Hysteria2Settings hysteria2 = 14;
    TuicSettings tuic = 15;
    WireGuardSettings wireguard = 16;
  }
}

enum TransportType {
  TRANSPORT_TYPE_UNSPECIFIED = 0;
  TRANSPORT_TYPE_TCP = 1;
  TRANSPORT_TYPE_WEBSOCKET = 2;
  TRANSPORT_TYPE_GRPC = 3;
  TRANSPORT_TYPE_HTTP_UPGRADE = 4;
  TRANSPORT_TYPE_XHTTP = 5;
  TRANSPORT_TYPE_QUIC = 6;
  // Чистый UDP — у WireGuard.
  TRANSPORT_TYPE_UDP = 7;
}

message Transport {
  TransportType type = 1;
  string path = 2;
  string host = 3;
  string service_name = 4;
}

enum SecurityType {
  SECURITY_TYPE_UNSPECIFIED = 0;
  SECURITY_TYPE_NONE = 1;
  SECURITY_TYPE_TLS = 2;
  SECURITY_TYPE_REALITY = 3;
}

message Security {
  SecurityType type = 1;
  string sni = 2;
  // Отпечаток uTLS: chrome, firefox, safari…
  string fingerprint = 3;
  repeated string alpn = 4;
  bool allow_insecure = 5;
  string reality_public_key = 6;
  string reality_short_id = 7;
  string reality_spider_x = 8;
}

message VlessSettings {
  string uuid = 1;
  // Например xtls-rprx-vision.
  string flow = 2;
}

message VmessSettings {
  string uuid = 1;
  string cipher = 2;
}

message TrojanSettings {
  string password = 1;
}

message ShadowsocksSettings {
  string method = 1;
  string password = 2;
}

message Hysteria2Settings {
  string password = 1;
  string obfs_password = 2;
  uint32 up_mbps = 3;
  uint32 down_mbps = 4;
}

message TuicSettings {
  string uuid = 1;
  string password = 2;
  string congestion_control = 3;
}

message WireGuardSettings {
  string private_key = 1;
  string peer_public_key = 2;
  string preshared_key = 3;
  repeated string addresses = 4;
  uint32 mtu = 5;
}

// ── Защита и маршрутизация ──────────────────────────────────────────────────

message ProtectionSettings {
  // Блок при обрыве: нет туннеля — нет интернета.
  bool kill_switch = 1;
  bool block_ipv6 = 2;
  // Доступ к локальной сети мимо VPN (по умолчанию запрещен).
  bool allow_lan = 3;
  DnsSettings dns = 4;
  // Блок действует с загрузки ОС до старта службы.
  bool boot_protection = 5;
  // Строгий режим: блок и при ручном отключении VPN.
  bool strict_mode = 6;
  // Обнаружение устройств (mDNS/SSDP) — только вместе с allow_lan.
  bool lan_discovery = 7;
  AddressPreference address_preference = 8;
  // Сразу после подключения проверить утечки DNS и IP.
  bool check_leaks_after_connect = 9;
}

// Приоритет адресов для сайтов с IPv4 и IPv6.
enum AddressPreference {
  ADDRESS_PREFERENCE_UNSPECIFIED = 0;
  ADDRESS_PREFERENCE_PREFER_IPV4 = 1;
  ADDRESS_PREFERENCE_PREFER_IPV6 = 2;
  ADDRESS_PREFERENCE_IPV4_ONLY = 3;
}

message DnsSettings {
  // IP-адреса или DoH (https://…); пусто — DNS из профиля сервера.
  repeated string servers = 1;
  // Запретить DNS мимо туннеля.
  bool block_outside_dns = 2;
  bool fake_dns = 3;
}

message ApplyProtectionReply {
  ErrorInfo error = 1;
}

enum RoutingMode {
  ROUTING_MODE_UNSPECIFIED = 0;
  ROUTING_MODE_ALL_TRAFFIC = 1;
  ROUTING_MODE_SPLIT = 2;
}

enum RuleAction {
  RULE_ACTION_UNSPECIFIED = 0;
  RULE_ACTION_PROXY = 1;
  RULE_ACTION_DIRECT = 2;
  RULE_ACTION_BLOCK = 3;
}

message DomainRule {
  // Домен, *.домен или geosite:категория.
  string pattern = 1;
  RuleAction action = 2;
}

message RoutingSettings {
  RoutingMode mode = 1;
  // Программы в обход VPN (раздельный режим): путь к исполняемому файлу или идентификатор.
  repeated string bypass_apps = 2;
  repeated DomainRule rules = 3;
}

// ── Вход в Wi-Fi ────────────────────────────────────────────────────────────

message CaptivePauseRequest {
  google.protobuf.Duration duration = 1;
  // true — вернуть защиту раньше срока.
  bool cancel = 2;
}

message CaptivePauseReply {
  google.protobuf.Timestamp until = 1;
  ErrorInfo error = 2;
}

// ── Проверка и журнал ───────────────────────────────────────────────────────

message RunChecksRequest {}

message CheckResult {
  // Идентификатор проверки: service, core, all_traffic, kill_switch, dns, ipv6, exit_ip, other_vpn.
  string id = 1;
  CheckState state = 2;
  // Подробности без секретов — для журнала и отчета, интерфейс их не переводит.
  string details = 3;
  // Код уточнения для текста интерфейса: simulated, no_reply, system_proxy, vpn_adapter…
  // Пусто — текст по состоянию.
  string reason = 4;
}

message CheckReport {
  repeated CheckResult results = 1;
  google.protobuf.Timestamp finished_at = 2;
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARNING = 3;
  LOG_LEVEL_ERROR = 4;
}

message WatchLogRequest {
  // Сколько последних записей прислать сразу.
  int32 tail = 1;
}

message LogEntry {
  google.protobuf.Timestamp time = 1;
  LogLevel level = 2;
  // service, xray, sing-box, firewall, dns…
  string source = 3;
  // Уже пропущено через маскирование секретов.
  string message = 4;
}

// ── Пинг ────────────────────────────────────────────────────────────────────

message LatencyTarget {
  string id = 1;
  // Адрес и порт — для подписи в журнале службы; меряет служба по server.
  string host = 2;
  uint32 port = 3;
  // Сервер целиком: задержку служба меряет запросом через ядро, как при подключении, а не пингом адреса.
  ServerEndpoint server = 4;
}

enum LatencyFailure {
  LATENCY_FAILURE_UNSPECIFIED = 0;
  // Ядро за сервер не возьмется (Hysteria2 и TUIC — до второго ядра, нет ключа).
  LATENCY_FAILURE_UNSUPPORTED = 1;
  // Через сервер не пришел ответ за отведенное время.
  LATENCY_FAILURE_NO_RESPONSE = 2;
  // Ядро не запустилось — проверка не состоялась, сервер ни при чем.
  LATENCY_FAILURE_CORE_FAILED = 3;
}

message MeasureLatencyRequest {
  repeated LatencyTarget targets = 1;
}

message LatencyResult {
  string id = 1;
  bool reachable = 2;
  int32 latency_ms = 3;
  // Почему reachable = false; у доступного — UNSPECIFIED.
  LatencyFailure failure = 4;
}

message MeasureLatencyReply {
  repeated LatencyResult results = 1;
}

// ── Служба ──────────────────────────────────────────────────────────────────

message GetServiceInfoRequest {}
message GetStatusRequest {}
message WatchStatusRequest {}

message CoreInfo {
  // xray или sing-box.
  string name = 1;
  string version = 2;
  bool available = 3;
}

message ServiceInfo {
  string service_version = 1;
  // Версия контракта: «1».
  string api_version = 2;
  string os = 3;
  repeated CoreInfo cores = 4;
}

// ── Обновление ──────────────────────────────────────────────────────────────

enum UpdateChannel {
  UPDATE_CHANNEL_UNSPECIFIED = 0;
  UPDATE_CHANNEL_STABLE = 1;
  // Предварительные выпуски (с «-» в версии) и стабильные.
  UPDATE_CHANNEL_BETA = 2;
}

enum UpdateState {
  UPDATE_STATE_UNSPECIFIED = 0;
  // В программе нет ключа подписи обновлений: проверить выпуск нечем, обновления — с первого подписанного.
  UPDATE_STATE_NOT_SIGNED = 1;
  UPDATE_STATE_UP_TO_DATE = 2;
  UPDATE_STATE_AVAILABLE = 3;
  // Нет связи с GitHub или он не ответил; подробности — в журнале службы.
  UPDATE_STATE_FAILED = 4;
}

message CheckForUpdateRequest {
  UpdateChannel channel = 1;
  bool force = 2;
}

message UpdateOffer {
  UpdateState state = 1;
  // AVAILABLE: версия выпуска, главное из его заметок, страница выпуска на GitHub.
  string version = 2;
  repeated string highlights = 3;
  string notes_url = 4;
  // Когда служба проверяла (ответ мог быть из памяти).
  google.protobuf.Timestamp checked_at = 5;
  // Служба поставит его сама (MSI, .deb, .rpm установленной программы); нет — окно ведет на страницу выпуска.
  bool installable = 6;
  // Прежняя версия, на которую служба откатит сама (стояла до этой, выпуск подписан, файл этой установки в нем есть):
  // DownloadUpdate и InstallUpdate принимают и ее. Пусто — откатиться не на что.
  string rollback = 7;
  // AVAILABLE: после обновления можно будет вернуться на нынешнюю версию (ее выпуск подписан, файл этой установки
  // есть) — «можно откатить на 0.1.0». Пусто — обещать нечего.
  string return_to = 8;
}

message DownloadUpdateRequest {
  string version = 1;
}

message UpdateDownload {
  int64 received = 1;
  int64 total = 2;
  // Последнее сообщение: файл скачан и сверен (ready) или отказ (error — для журнала окна).
  bool ready = 3;
  string error = 4;
}

message InstallUpdateRequest {
  string version = 1;
}

message InstallUpdateReply {
  // 0 — установщик не запущен (error — почему).
  int32 installer_pid = 1;
  string error = 2;
}

// ── Сетевой инспектор ───────────────────────────────────────────────────────

message InspectNetworkRequest {}

enum AdapterKind {
  ADAPTER_KIND_UNSPECIFIED = 0;
  ADAPTER_KIND_ETHERNET = 1;
  ADAPTER_KIND_WIFI = 2;
  ADAPTER_KIND_CELLULAR = 3;
  // TUN, WireGuard, PPP, TAP — свой или чужой VPN.
  ADAPTER_KIND_TUNNEL = 4;
  ADAPTER_KIND_LOOPBACK = 5;
  ADAPTER_KIND_OTHER = 6;
}

message NetworkAddress {
  string address = 1;
  int32 prefix_length = 2;
}

message NetworkCard {
  // Имя адаптера в ОС (eth0, en0, «Ethernet») и описание драйвера.
  string name = 1;
  string description = 2;
  AdapterKind kind = 3;
  bool up = 4;
  // aa:bb:cc:dd:ee:ff; у туннелей и петли — пусто.
  string mac = 5;
  // 0 — неизвестно.
  int32 mtu = 6;
  int64 speed_bps = 7;
  repeated NetworkAddress addresses = 8;
  repeated string gateways = 9;
  repeated string dns_servers = 10;
  // Адрес получен автоматически (DHCP); сервер и остаток аренды — если ОС их знает.
  bool dhcp = 11;
  string dhcp_server = 12;
  google.protobuf.Duration dhcp_remaining = 13;
}

message NetworkRoute {
  // Сеть с префиксом или default.
  string destination = 1;
  // Пусто — сеть рядом, без шлюза.
  string gateway = 2;
  string interface = 3;
  // 0 — ОС метрики не называет.
  int32 metric = 4;
}

message NetworkSnapshot {
  google.protobuf.Timestamp taken_at = 1;
  repeated NetworkCard cards = 2;
  repeated NetworkRoute routes = 3;
}

message DescribeAddressRequest {
  string address = 1;
}

message MeasureIpRequest {}

message MeasureIpReply {}

enum ProbeKind {
  PROBE_KIND_UNSPECIFIED = 0;
  PROBE_KIND_PING = 1;
  PROBE_KIND_TRACE = 2;
  PROBE_KIND_DNS = 3;
  PROBE_KIND_TCP = 4;
  PROBE_KIND_TLS = 5;
}

message ProbeRequest {
  ProbeKind kind = 1;
  // IP или имя хоста.
  string target = 2;
  // Порт TCP и TLS: 1–65535.
  int32 port = 3;
}

enum ProbeOutcome {
  PROBE_OUTCOME_UNSPECIFIED = 0;
  PROBE_OUTCOME_OK = 1;
  // Промежуточный узел трассировки.
  PROBE_OUTCOME_HOP = 2;
  PROBE_OUTCOME_TIMED_OUT = 3;
  PROBE_OUTCOME_REFUSED = 4;
  PROBE_OUTCOME_UNREACHABLE = 5;
  PROBE_OUTCOME_NOT_FOUND = 6;
  PROBE_OUTCOME_FAILED = 7;
}

enum TlsProblem {
  TLS_PROBLEM_UNSPECIFIED = 0;
  TLS_PROBLEM_NAME_MISMATCH = 1;
  TLS_PROBLEM_EXPIRED = 2;
  TLS_PROBLEM_NOT_YET_VALID = 3;
  TLS_PROBLEM_UNTRUSTED = 4;
  TLS_PROBLEM_OTHER = 5;
}

message TlsFacts {
  // «TLS 1.3».
  string protocol = 1;
  string cipher = 2;
  // Согласованный протокол приложения (h2, http/1.1); пусто — не согласован.
  string alpn = 3;
  string subject = 4;
  string issuer = 5;
  google.protobuf.Timestamp not_before = 6;
  google.protobuf.Timestamp not_after = 7;
  // Имена сертификата (SAN).
  repeated string names = 8;
  // Пусто — с сертификатом все в порядке.
  repeated TlsProblem problems = 9;
}

message ListConnectionsRequest {}

enum SocketProtocol {
  SOCKET_PROTOCOL_UNSPECIFIED = 0;
  SOCKET_PROTOCOL_TCP = 1;
  SOCKET_PROTOCOL_UDP = 2;
}

enum SocketState {
  SOCKET_STATE_UNSPECIFIED = 0;
  SOCKET_STATE_LISTEN = 1;
  SOCKET_STATE_ESTABLISHED = 2;
  SOCKET_STATE_OPENING = 3;
  SOCKET_STATE_CLOSING = 4;
  // UDP: открыт.
  SOCKET_STATE_OPEN = 5;
}

message NetworkConnection {
  SocketProtocol protocol = 1;
  string local_address = 2;
  int32 local_port = 3;
  // Пусто — другой стороны нет (слушает или UDP без связи).
  string remote_address = 4;
  int32 remote_port = 5;
  SocketState state = 6;
  // 0 — ОС не назвала владельца.
  int32 process_id = 7;
  // Пусто — имя неизвестно.
  string process = 8;
}

message ConnectionList {
  repeated NetworkConnection connections = 1;
}

message WatchTrafficRequest {}

message AdapterCounters {
  string name = 1;
  int64 received = 2;
  int64 sent = 3;
}

message TrafficSample {
  google.protobuf.Timestamp taken_at = 1;
  repeated AdapterCounters adapters = 2;
}

message ProbeStep {
  // Номер эха, участок трассировки (TTL) или номер адреса имени; у TCP и TLS — 1.
  int32 index = 1;
  // Кто ответил или к кому шли; пусто — неизвестно.
  string address = 2;
  // Время ответа; нет — ответа не было.
  google.protobuf.Duration time = 3;
  ProbeOutcome outcome = 4;
  // Только у замера TLS.
  TlsFacts tls = 5;
}

enum AddressFailure {
  ADDRESS_FAILURE_UNSPECIFIED = 0;
  // Частный или служебный адрес: в интернете о нем ничего нет.
  ADDRESS_FAILURE_PRIVATE = 1;
  // Источник не ответил (нет сети, сеть закрыта блоком, отказ сервиса).
  ADDRESS_FAILURE_UNREACHABLE = 2;
  // Источник об адресе ничего не знает.
  ADDRESS_FAILURE_NOT_FOUND = 3;
}

message AddressInfo {
  string address = 1;
  // 0 — неизвестна.
  int64 asn = 2;
  string holder = 3;
  string prefix = 4;
  // Код страны ISO 3166 и город — примерно, по базе геолокации.
  string country = 5;
  string city = 6;
  // UNSPECIFIED — сведения есть.
  AddressFailure failure = 7;
}
