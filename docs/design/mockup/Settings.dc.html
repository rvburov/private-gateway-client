<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройки — Private Gateway Client</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF2F8;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
a{color:#2563EB}a:hover{color:#1D4ED8}
button:focus,a:focus{outline:none}
button:focus-visible,a:focus-visible{outline:2px solid #93C5FD;outline-offset:2px}
.pg-row:hover{background:rgba(15,23,42,.03)}
.pg-noscroll{scrollbar-width:none;-ms-overflow-style:none}
.pg-noscroll::-webkit-scrollbar{display:none}
.pg-noscroll>*{flex-shrink:0}
.pg-nav:hover{color:#0B0F19}
</style>
</helmet>
<div style="position: relative; width: 440px; height: 1260px; overflow: hidden; background: #EEF2F8; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #0B0F19">
  <div aria-hidden="true" style="position: absolute; left: -80px; top: -60px; width: 300px; height: 300px; border-radius: 50%; background: #93C5FD; opacity: 0.55"></div>
  <div aria-hidden="true" style="position: absolute; right: -90px; top: 480px; width: 280px; height: 280px; border-radius: 50%; background: #86EFAC; opacity: 0.45"></div>
  <div aria-hidden="true" style="position: absolute; left: 40px; bottom: -120px; width: 320px; height: 260px; border-radius: 50%; background: #C4B5FD; opacity: 0.45"></div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; background: rgba(246, 248, 252, 0.7); backdrop-filter: blur(48px) saturate(170%); -webkit-backdrop-filter: blur(48px) saturate(170%)">
    <header style="display: flex; align-items: center; height: 60px; padding: 0 20px; flex: 0 0 auto">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.015em">Настройки</h1>
    </header>

    <div class="pg-noscroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px 160px; display: flex; flex-direction: column; gap: 16px">
      <section aria-label="Основные" style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 6px; font-size: 11px; font-weight: 600; color: #4B5565; text-transform: uppercase; letter-spacing: 0.06em">Основные</h2>
        <div style="background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(15, 23, 42, 0.08); border-radius: 20px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06); padding: 4px 16px">
          <div style="padding: 14px 0; border-bottom: 1px solid rgba(15, 23, 42, 0.07); display: flex; flex-direction: column; gap: 10px">
            <span style="font-weight: 600">Режим</span>
            <div role="radiogroup" aria-label="Режим" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: rgba(15, 23, 42, 0.05)">
              <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
                <button type="button" role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
              </sc-for>
            </div>
            <span style="font-size: 12px; color: {{modeNoteC}}; line-height: 1.45">{{modeNote}}</span>
          </div>
          <sc-for list="{{basic}}" as="r" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px solid rgba(15, 23, 42, 0.07)">
              <div style="display: flex; flex-direction: column; gap: 3px">
                <span style="font-weight: 600">{{r.k}}</span>
                <span style="font-size: 12px; color: #4B5565; line-height: 1.45">{{r.d}}</span>
              </div>
              <button type="button" role="switch" aria-checked="{{r.aria}}" aria-label="{{r.k}}" onClick="{{r.flip}}" style="{{r.sw}}"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.25)"></span></button>
            </div>
          </sc-for>
          <div style="padding: 13px 0; border-bottom: 1px solid rgba(15, 23, 42, 0.07); display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; flex-direction: column; gap: 3px">
              <span style="font-weight: 600">Уведомления</span>
              <span style="font-size: 12px; color: #4B5565; line-height: 1.45">{{notifNote}}</span>
            </div>
            <div role="radiogroup" aria-label="Уведомления" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: rgba(15, 23, 42, 0.05)">
              <sc-for list="{{notifs}}" as="n" hint-placeholder-count="3">
                <button type="button" role="radio" aria-checked="{{n.on}}" onClick="{{n.pick}}" style="{{n.style}}">{{n.label}}</button>
              </sc-for>
            </div>
          </div>
          <div style="padding: 13px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px">
            <span style="font-weight: 600">Язык</span>
            <div role="radiogroup" aria-label="Язык" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: rgba(15, 23, 42, 0.05); width: 190px">
              <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
                <button type="button" role="radio" aria-checked="{{l.on}}" onClick="{{l.pick}}" style="{{l.style}}">{{l.label}}</button>
              </sc-for>
            </div>
          </div>
        </div>
      </section>

      <section aria-label="Для опытных" style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 6px; font-size: 11px; font-weight: 600; color: #4B5565; text-transform: uppercase; letter-spacing: 0.06em">Для опытных</h2>
        <div style="background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(15, 23, 42, 0.08); border-radius: 20px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06); padding: 6px">
          <sc-for list="{{adv}}" as="a" hint-placeholder-count="7">
            <a href="{{a.href}}" class="pg-row" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 10px; border-radius: 14px; text-decoration: none; color: #0B0F19">
              <span style="width: 36px; height: 36px; border-radius: 11px; background: rgba(37, 99, 235, 0.10); color: #1D4ED8; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"></path></svg>
              </span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-weight: 600">{{a.k}}</span>
                <span style="font-size: 12px; color: #4B5565">{{a.d}}</span>
              </span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4B5565" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
            </a>
          </sc-for>
        </div>
      </section>

      <p style="margin: 0 6px; font-size: 12px; color: #4B5565; line-height: 1.5">Private Gateway Client 0.1 · служба: работает · ядро: Xray-core [ВЕРСИЯ]</p>
    </div>

    <footer style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; pointer-events: none">
      <svg width="440" height="150" viewBox="0 0 440 150" aria-hidden="true" style="position: absolute; left: 0; top: 0; display: block; overflow: visible; filter: drop-shadow(0 6px 18px rgba(15, 23, 42, 0.14))"><path d="M50 70 H156.5 A18 18 0 0 0 173.82 56.91 A48 48 0 0 1 266.18 56.91 A18 18 0 0 0 283.5 70 H390 A26 26 0 0 1 416 96 V112 A26 26 0 0 1 390 138 H50 A26 26 0 0 1 24 112 V96 A26 26 0 0 1 50 70 Z" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.06)" stroke-width="1" style="pointer-events: auto"></path></svg>
      <nav aria-label="Главное меню" style="position: absolute; left: 24px; right: 24px; top: 70px; bottom: 12px; display: grid; grid-template-columns: 1fr 1fr 92px 1fr 1fr; padding: 0 12px 9px; pointer-events: auto">
        <sc-for list="{{navL}}" as="n" hint-placeholder-count="2">
          <a href="{{n.href}}" class="pg-nav" aria-current="{{n.cur}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; text-decoration: none; color: {{n.color}}; font-size: 11.5px; font-weight: {{n.weight}}; line-height: 14px">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.shape}}" fill="{{n.fill}}"></path><path d="{{n.detail}}"></path></svg>
            {{n.label}}
          </a>
        </sc-for>
        <span style="display: flex; align-items: flex-end; justify-content: center; font-size: 12px; line-height: 14px; font-weight: 700; color: #15803D">Защищено</span>
        <sc-for list="{{navR}}" as="n" hint-placeholder-count="2">
          <a href="{{n.href}}" class="pg-nav" aria-current="{{n.cur}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; text-decoration: none; color: {{n.color}}; font-size: 11.5px; font-weight: {{n.weight}}; line-height: 14px">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.shape}}" fill="{{n.fill}}"></path><path d="{{n.detail}}"></path></svg>
            {{n.label}}
          </a>
        </sc-for>
      </nav>
      <button type="button" aria-label="Отключить VPN" style="position: absolute; top: 30px; left: 180px; width: 80px; height: 80px; border-radius: 50%; border: 4px solid #16A34A; background: #FFFFFF; color: #15803D; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25); pointer-events: auto">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l7.5 3v5.4c0 4.7-3.1 8.6-7.5 10-4.4-1.4-7.5-5.3-7.5-10V5.8z"></path><path d="M8.8 12.2l2.2 2.2 4.4-4.6"></path></svg>
      </button>
    </footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":1260}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const mode = st.mode || 'vpn';
    const lang = st.lang || 'ru';
    const notif = st.notif || 'important';
    const def = { ks: true, auto: true, autoConn: false, tray: true };
    const v = (id) => (st[id] == null ? def[id] : st[id]);
    const row = (id, k, d) => {
      const on = v(id);
      return {
        k, d, aria: on ? 'true' : 'false',
        sw: 'flex: 0 0 auto; width: 48px; height: 28px; border-radius: 999px; border: none; padding: 3px; cursor: pointer; display: flex; transition: background 0.2s ease; ' + (on ? 'background: #2563EB; justify-content: flex-end;' : 'background: #C3CAD6; justify-content: flex-start;'),
        flip: () => this.setState({ [id]: !on })
      };
    };
    const seg = (cur, key) => ([id, label]) => ({
      label, on: id === cur ? 'true' : 'false',
      style: 'height: 38px; border: none; border-radius: 9px; font: inherit; font-size: 13.5px; cursor: pointer; ' + (id === cur ? 'background: #FFFFFF; color: #0B0F19; font-weight: 600; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.14);' : 'background: transparent; color: #374151;'),
      pick: () => this.setState({ [key]: id })
    });
    const modes = [['vpn', 'VPN · вся система'], ['proxy', 'Только прокси']].map(seg(mode, 'mode'));
    const langs = [['ru', 'Русский'], ['en', 'English']].map(seg(lang, 'lang'));
    const notifs = [['all', 'Все'], ['important', 'Только важные'], ['off', 'Выключены']].map(seg(notif, 'notif'));
    const notifNote = { all: 'Важные и обычные: подключение, серверы, обновления', important: 'Обрыв, блокировка интернета, вход в Wi-Fi, сбой службы', off: 'Только значок в трее меняет цвет. Окно и трей покажут всё' }[notif];
    const basic = [
      row('ks', 'Блок при обрыве (Kill Switch)', 'Нет туннеля — нет интернета. Защита от утечек при обрыве.'),
      row('auto', 'Запуск вместе с Windows', 'Свёрнуто в трей'),
      row('autoConn', 'Подключаться при запуске', 'Только к выбранному вами серверу'),
      row('tray', 'Сворачивать в трей', 'Закрытие окна не отключает VPN')
    ];
    const adv = [
      { k: 'Защита и утечки', d: 'Kill Switch, DNS, IPv6, локальная сеть', href: 'Protection.dc.html', icon: 'M12 2.8l7.5 3v5.4c0 4.7-3.1 8.6-7.5 10-4.4-1.4-7.5-5.3-7.5-10V5.8zM12 8v5M12 16h.01' },
      { k: 'Подключение и ядро', d: 'Ядро, TUN, MTU, Mux, фрагментация, uTLS', href: 'Advanced.dc.html', icon: 'M7 7h10v10H7zM10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4' },
      { k: 'Маршрутизация', d: 'Правила, раздельное туннелирование', href: 'Routing.dc.html', icon: 'M6 3v6a6 6 0 0 0 6 6h6M15 12l3 3-3 3M6 21v-4' },
      { k: 'Профили и подписки', d: '4 подписки · автообновление каждые 12 ч', href: 'Subscriptions.dc.html', icon: 'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01' },
      { k: 'Проверка и логи', d: 'Проверка утечек, журнал, отчёт', href: 'Diagnostics.dc.html', icon: 'M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5zM6.5 12.5h2.4l1.7-4 2.6 7.5 1.8-3.5h2.5' },
      { k: 'Резервная копия', d: 'Экспорт и импорт настроек', href: 'Backup.dc.html', icon: 'M12 3v12M7 10l5 5 5-5M4 19h16' },
      { k: 'О программе', d: 'Версии, обновление, лицензии', href: 'About.dc.html', icon: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 11v6M12 7.5h.01' }
    ];
    const proxy = mode === 'proxy';
    const ICONS = {
      home: { shape: 'M4 5.5A1.5 1.5 0 0 1 5.5 4h3A1.5 1.5 0 0 1 10 5.5v3A1.5 1.5 0 0 1 8.5 10h-3A1.5 1.5 0 0 1 4 8.5zM14 5.5A1.5 1.5 0 0 1 15.5 4h3A1.5 1.5 0 0 1 20 5.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 14 8.5zM4 15.5A1.5 1.5 0 0 1 5.5 14h3a1.5 1.5 0 0 1 1.5 1.5v3A1.5 1.5 0 0 1 8.5 20h-3A1.5 1.5 0 0 1 4 18.5zM14 15.5a1.5 1.5 0 0 1 1.5-1.5h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3a1.5 1.5 0 0 1-1.5-1.5z', detail: 'M-9 -9' },
      servers: { shape: 'M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 15a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z', detail: 'M7.2 7.5h1M7.2 16.5h1M11.5 7.5h5M11.5 16.5h5' },
      diag: { shape: 'M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z', detail: 'M6.5 12.5h2.4l1.7-4 2.6 7.5 1.8-3.5h2.5' },
      settings: { shape: 'M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z', detail: 'M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z' }
    };
    const item = (id, label, href) => {
      const active = id === 'settings';
      return {
        label, href, shape: ICONS[id].shape, detail: ICONS[id].detail, cur: active ? 'page' : 'false',
        fill: active ? 'rgba(37, 99, 235, 0.16)' : 'none',
        color: active ? '#2563EB' : '#4B5565', weight: active ? 600 : 500
      };
    };
    return {
      modes, langs, basic, adv, notifs, notifNote,
      modeNote: proxy ? 'Прокси не покрывает весь трафик: часть программ пойдёт напрямую. Блок при обрыве недоступен.' : 'Весь трафик Windows идёт через туннель: браузеры, терминал, Git, фоновые службы.',
      modeNoteC: proxy ? '#9A3412' : '#4B5565',
      navL: [item('home', 'Главная', 'Main.dc.html'), item('servers', 'Серверы', 'Servers.dc.html')],
      navR: [item('diag', 'Проверка', 'Diagnostics.dc.html'), item('settings', 'Настройки', 'Settings.dc.html')]
    };
  }
}
</script>
</body>
</html>
