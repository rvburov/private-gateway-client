<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Добавить профиль — Private Gateway Client</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF2F8;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
a{color:#2563EB}a:hover{color:#1D4ED8}
button:focus,a:focus,input:focus{outline:none}
button:focus-visible,a:focus-visible{outline:2px solid #93C5FD;outline-offset:2px}
input:focus-visible{border-color:#2563EB !important}
.pg-ib:hover{background:rgba(15,23,42,.06)}
</style>
</helmet>
<div style="position: relative; width: 440px; height: 760px; overflow: hidden; background: #EEF2F8; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #0B0F19">
  <div aria-hidden="true" style="position: absolute; left: -80px; top: -60px; width: 300px; height: 300px; border-radius: 50%; background: #93C5FD; opacity: 0.55"></div>
  <div aria-hidden="true" style="position: absolute; right: -90px; top: 250px; width: 280px; height: 280px; border-radius: 50%; background: #86EFAC; opacity: 0.45"></div>
  <div aria-hidden="true" style="position: absolute; left: 40px; bottom: -120px; width: 320px; height: 260px; border-radius: 50%; background: #C4B5FD; opacity: 0.45"></div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; background: rgba(246, 248, 252, 0.7); backdrop-filter: blur(48px) saturate(170%); -webkit-backdrop-filter: blur(48px) saturate(170%)">
    <header style="display: flex; align-items: center; gap: 4px; height: 60px; padding: 0 12px; flex: 0 0 auto">
      <a href="Main.dc.html" class="pg-ib" aria-label="Назад" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #0B0F19">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.015em">Добавить профиль</h1>
    </header>

    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px 12px; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{ways}}" as="w" hint-placeholder-count="4">
        <button type="button" onClick="{{w.pick}}" aria-pressed="{{w.on}}" style="{{w.style}}">
          <span style="width: 42px; height: 42px; border-radius: 12px; background: rgba(37, 99, 235, 0.10); color: #1D4ED8; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{w.icon}}"></path></svg>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left">
            <span style="font-weight: 600; font-size: 15px">{{w.title}}</span>
            <span style="font-size: 12px; color: #4B5565">{{w.desc}}</span>
          </span>
        </button>
      </sc-for>

      <sc-if value="{{isUrl}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 2px 2px 0">
          <label for="url" style="font-size: 12px; font-weight: 600; color: #4B5565">Ссылка на подписку или конфиг</label>
          <input id="url" type="url" value="https://example.com/sub/••••••••" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(15, 23, 42, 0.14); background: rgba(255, 255, 255, 0.92); font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #0B0F19">
        </div>
      </sc-if>

      <section aria-label="Предпросмотр" style="margin-top: 4px; padding: 14px 16px; border-radius: 20px; background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(15, 23, 42, 0.08); box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06); display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <span style="font-size: 11px; font-weight: 600; color: #4B5565; text-transform: uppercase; letter-spacing: 0.06em">Предпросмотр</span>
          <span style="font-size: 12px; color: #4B5565">base64 · VLESS / Hy2 / TUIC</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; text-align: center">
          <div style="padding: 8px 2px; border-radius: 12px; background: rgba(15, 23, 42, 0.04)"><div style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600">12</div><div style="font-size: 11px; color: #4B5565">найдено</div></div>
          <div style="padding: 8px 2px; border-radius: 12px; background: rgba(22, 163, 74, 0.08)"><div style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; color: #15803D">9</div><div style="font-size: 11px; color: #166534">новых</div></div>
          <div style="padding: 8px 2px; border-radius: 12px; background: rgba(15, 23, 42, 0.04)"><div style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600">2</div><div style="font-size: 11px; color: #4B5565">дубли</div></div>
          <div style="padding: 8px 2px; border-radius: 12px; background: rgba(234, 88, 12, 0.09)"><div style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; color: #C2410C">1</div><div style="font-size: 11px; color: #9A3412">ошибка</div></div>
        </div>
        <p style="margin: 0; padding: 10px 12px; border-radius: 12px; background: rgba(234, 88, 12, 0.08); border: 1px solid rgba(234, 88, 12, 0.18); color: #9A3412; font-size: 12.5px; line-height: 1.45">Строка 7: параметры не распознаны — пропущено.</p>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="pname" style="font-size: 12px; font-weight: 600; color: #4B5565">Название профиля</label>
          <input id="pname" type="text" value="Основная подписка" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(15, 23, 42, 0.14); background: #FFFFFF; font: inherit; color: #0B0F19">
        </div>
      </section>
    </div>

    <div style="padding: 8px 20px 20px; flex: 0 0 auto">
      <button type="button" style="width: 100%; height: 54px; border-radius: 16px; border: none; background: #2563EB; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 22px rgba(37, 99, 235, 0.30)">Добавить 9 серверов</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = (this.state && this.state.w) || 'clip';
    const wl = [
      ['clip', 'M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1zM8 5H6.5A1.5 1.5 0 0 0 5 6.5v13A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-13A1.5 1.5 0 0 0 17.5 5H16', 'Из буфера обмена', 'Ссылки vless://, hy2://, tuic://, wg, подписки'],
      ['qr', 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2M14 18v2M18 18h2v2', 'QR-код с экрана', 'Выделите область экрана или перетащите картинку'],
      ['url', 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1', 'Ввести ссылку', 'Подписка /sub/…, sing-box JSON, Clash/Mihomo YAML'],
      ['file', 'M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8zM14 3v5h5', 'Открыть файл', '.json · .yaml · .conf (WireGuard) · .txt']
    ];
    const ways = wl.map(([id, icon, title, desc]) => ({
      icon, title, desc, on: id === sel ? 'true' : 'false',
      style: 'display: flex; align-items: center; gap: 12px; width: 100%; min-height: 66px; padding: 10px 14px; border-radius: 16px; font: inherit; color: #0B0F19; cursor: pointer; ' + (id === sel ? 'background: #FFFFFF; border: 1.5px solid #2563EB; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.12);' : 'background: rgba(255, 255, 255, 0.8); border: 1.5px solid rgba(15, 23, 42, 0.06);'),
      pick: () => this.setState({ w: id })
    }));
    return { ways, isUrl: sel === 'url' };
  }
}
</script>
</body>
</html>
