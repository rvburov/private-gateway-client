<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Подключение и ядро — Private Gateway Client</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF2F8;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
a{color:#2563EB}a:hover{color:#1D4ED8}
button:focus,a:focus,select:focus{outline:none}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #93C5FD;outline-offset:2px}
.pg-ib:hover{background:rgba(15,23,42,.06)}
.pg-nav:hover{color:#0B0F19}
.pg-opt:hover{background:rgba(37,99,235,.07)}
.pg-dd:hover{border-color:rgba(37,99,235,.45) !important}
.pg-noscroll{scrollbar-width:none;-ms-overflow-style:none}
.pg-noscroll::-webkit-scrollbar{display:none}
.pg-noscroll>*{flex-shrink:0}
</style>
</helmet>
<div style="position: relative; width: 440px; height: 1240px; overflow: hidden; background: #EEF2F8; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #0B0F19">
  <div aria-hidden="true" style="position: absolute; left: -80px; top: -60px; width: 300px; height: 300px; border-radius: 50%; background: #93C5FD; opacity: 0.55"></div>
  <div aria-hidden="true" style="position: absolute; right: -90px; top: 500px; width: 280px; height: 280px; border-radius: 50%; background: #86EFAC; opacity: 0.45"></div>
  <div aria-hidden="true" style="position: absolute; left: 40px; bottom: -120px; width: 320px; height: 260px; border-radius: 50%; background: #C4B5FD; opacity: 0.45"></div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; background: rgba(246, 248, 252, 0.7); backdrop-filter: blur(48px) saturate(170%); -webkit-backdrop-filter: blur(48px) saturate(170%)">
    <header style="display: flex; align-items: center; gap: 4px; height: 60px; padding: 0 12px; flex: 0 0 auto">
      <a href="Settings.dc.html" class="pg-ib" aria-label="Назад к настройкам" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #0B0F19">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.015em">Подключение и ядро</h1>
    </header>

    <div class="pg-noscroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px 160px; display: flex; flex-direction: column; gap: 16px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
        <section aria-label="{{g.title}}" style="display: flex; flex-direction: column; gap: 8px">
          <h2 style="margin: 0 6px; font-size: 11px; font-weight: 600; color: #4B5565; text-transform: uppercase; letter-spacing: 0.06em">{{g.title}}</h2>
          <div style="background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(15, 23, 42, 0.08); border-radius: 20px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06); padding: 2px 16px">
            <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: {{r.sep}}">
                <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
                  <span style="font-weight: 600">{{r.k}}</span>
                  <span style="font-size: 12px; color: #4B5565; line-height: 1.45">{{r.d}}</span>
                </div>
                <sc-if value="{{r.isToggle}}" hint-placeholder-val="{{ true }}">
                  <button type="button" role="switch" aria-checked="{{r.aria}}" aria-label="{{r.k}}" onClick="{{r.flip}}" style="{{r.sw}}"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.25)"></span></button>
                </sc-if>
                <sc-if value="{{r.isSelect}}" hint-placeholder-val="{{ false }}">
                  <div style="position: relative; flex: 0 0 auto">
                    <button type="button" class="pg-dd" onClick="{{r.toggle}}" aria-haspopup="listbox" aria-expanded="{{r.aria}}" aria-label="{{r.k}}" style="{{r.btnStyle}}">
                      <span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.cur}}</span>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; transform: rotate({{r.chev}}deg); transition: transform 0.2s ease"><path d="M6 9l6 6 6-6"></path></svg>
                    </button>
                    <sc-if value="{{r.open}}" hint-placeholder-val="{{ false }}">
                      <div role="listbox" aria-label="{{r.k}}" style="position: absolute; right: 0; top: calc(100% + 6px); z-index: 50; min-width: 100%; width: max-content; padding: 6px; border-radius: 16px; background: rgba(255, 255, 255, 0.98); border: 1px solid rgba(15, 23, 42, 0.10); box-shadow: 0 16px 40px rgba(15, 23, 42, 0.20); display: flex; flex-direction: column; gap: 2px">
                        <sc-for list="{{r.items}}" as="o" hint-placeholder-count="3">
                          <button type="button" role="option" class="pg-opt" aria-selected="{{o.aria}}" onClick="{{o.pick}}" style="{{o.style}}">
                            <sc-if value="{{o.showBar}}" hint-placeholder-val="{{ false }}"><span style="width: 3px; height: 18px; border-radius: 2px; background: {{o.bar}}; flex: 0 0 auto"></span></sc-if>
                            <sc-if value="{{o.showRadio}}" hint-placeholder-val="{{ false }}"><span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid {{o.ring}}; display: flex; align-items: center; justify-content: center; flex: 0 0 auto"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{o.dot}}"></span></span></sc-if>
                            <span style="white-space: nowrap">{{o.label}}</span>
                          </button>
                        </sc-for>
                      </div>
                    </sc-if>
                  </div>
                </sc-if>
                <sc-if value="{{r.isInfo}}" hint-placeholder-val="{{ false }}">
                  <span style="flex: 0 0 auto; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 600; color: #1F2937; padding: 4px 8px; border-radius: 8px; background: rgba(15, 23, 42, 0.05)">{{r.val}}</span>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </div>

    <footer style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; pointer-events: none">
      <svg width="440" height="150" viewBox="0 0 440 150" aria-hidden="true" style="position: absolute; left: 0; top: 0; display: block; overflow: visible; filter: drop-shadow(0 6px 18px rgba(15, 23, 42, 0.14))"><path d="M50 70 H156.5 A18 18 0 0 0 173.82 56.91 A48 48 0 0 1 266.18 56.91 A18 18 0 0 0 283.5 70 H390 A26 26 0 0 1 416 96 V112 A26 26 0 0 1 390 138 H50 A26 26 0 0 1 24 112 V96 A26 26 0 0 1 50 70 Z" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.06)" stroke-width="1" style="pointer-events: auto"></path></svg>
      <nav aria-label="Главное меню" style="position: absolute; left: 24px; right: 24px; top: 70px; bottom: 12px; display: grid; grid-template-columns: 1fr 1fr 92px 1fr 1fr; padding: 0 12px 9px; pointer-events: auto">
        <sc-for list="{{navL}}" as="n" hint-placeholder-count="2">
          <a href="{{n.href}}" class="pg-nav" aria-current="{{n.cur}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; text-decoration: none; color: {{n.color}}; font-size: 11.5px; font-weight: {{n.weight}}; line-height: 14px">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.shape}}" fill="{{n.fill}}"></path><path d="{{n.detail}}"></path></svg>
            {{n.label}}
          </a>
        </sc-for>
        <span style="display: flex; align-items: flex-end; justify-content: center; font-size: 12px; line-height: 14px; font-weight: 700; color: #15803D">Защищено</span>
        <sc-for list="{{navR}}" as="n" hint-placeholder-count="2">
          <a href="{{n.href}}" class="pg-nav" aria-current="{{n.cur}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; text-decoration: none; color: {{n.color}}; font-size: 11.5px; font-weight: {{n.weight}}; line-height: 14px">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.shape}}" fill="{{n.fill}}"></path><path d="{{n.detail}}"></path></svg>
            {{n.label}}
          </a>
        </sc-for>
      </nav>
      <button type="button" aria-label="Отключить VPN" style="position: absolute; top: 30px; left: 180px; width: 80px; height: 80px; border-radius: 50%; border: 4px solid #16A34A; background: #FFFFFF; color: #15803D; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25); pointer-events: auto">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l7.5 3v5.4c0 4.7-3.1 8.6-7.5 10-4.4-1.4-7.5-5.3-7.5-10V5.8z"></path><path d="M8.8 12.2l2.2 2.2 4.4-4.6"></path></svg>
      </button>
    </footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"menuStyle":{"editor":"enum","options":["highlight","bar","radio"],"default":"highlight"},"$preview":{"width":440,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const def = { strict: true, sniff: true, mux: false, frag: false, lanProxy: false };
    const v = (id) => (st[id] == null ? def[id] : st[id]);
    const base = { isToggle: false, isSelect: false, isInfo: false };
    const t = (id, k, d) => {
      const on = v(id);
      return Object.assign({}, base, {
        k, d, isToggle: true, aria: on ? 'true' : 'false',
        sw: 'flex: 0 0 auto; width: 48px; height: 28px; border-radius: 999px; border: none; padding: 3px; cursor: pointer; display: flex; transition: background 0.2s ease; ' + (on ? 'background: #2563EB; justify-content: flex-end;' : 'background: #C3CAD6; justify-content: flex-start;'),
        flip: () => this.setState({ [id]: !on })
      });
    };
    const dd = st.dd || null;
    const vals = st.vals || {};
    const s = (k, d, opts) => {
      const cur = vals[k] || opts[0];
      const open = dd === k;
      return Object.assign({}, base, {
        k, d, isSelect: true, cur, open, aria: open ? 'true' : 'false', chev: open ? 180 : 0,
        btnStyle: 'max-width: 180px; height: 36px; padding: 0 10px 0 12px; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; color: #0B0F19; cursor: pointer; display: flex; align-items: center; gap: 6px; ' + (open ? 'border: 1px solid #2563EB; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);' : 'border: 1px solid rgba(15, 23, 42, 0.12);'),
        toggle: () => this.setState({ dd: open ? null : k }),
        items: opts.map((o) => {
          const on = o === cur;
          const ms = this.props.menuStyle || 'highlight';
          const bg = ms === 'highlight' ? (on ? 'rgba(37, 99, 235, 0.10)' : 'transparent') : ms === 'bar' ? (on ? 'rgba(37, 99, 235, 0.06)' : 'transparent') : 'transparent';
          return {
            label: o, aria: on ? 'true' : 'false',
            showBar: ms === 'bar', bar: on ? '#2563EB' : 'transparent',
            showRadio: ms === 'radio', ring: on ? '#2563EB' : '#9AA3B2', dot: on ? '#2563EB' : 'transparent',
            style: 'min-height: 40px; padding: 0 14px 0 ' + (ms === 'highlight' ? '14px' : '10px') + '; border: none; border-radius: 10px; background: ' + bg + '; font: inherit; font-size: 13.5px; font-weight: ' + (on ? 600 : 500) + '; color: ' + (on ? '#1D4ED8' : '#0B0F19') + '; cursor: pointer; display: flex; align-items: center; gap: 10px; text-align: left; white-space: nowrap;',
            pick: () => this.setState({ dd: null, vals: Object.assign({}, vals, { [k]: o }) })
          };
        })
      });
    };
    const i = (k, d, val) => Object.assign({}, base, { k, d, val, isInfo: true });
    const sep = (rows) => rows.map((r, idx) => Object.assign(r, { sep: idx === rows.length - 1 ? 'none' : '1px solid rgba(15, 23, 42, 0.07)' }));
    const groups = [
      { title: 'Сетевое ядро', rows: sep([
        i('Xray-core', 'VLESS/REALITY/XHTTP, VMess, Trojan, Shadowsocks, WireGuard', '[ВЕРСИЯ]'),
        i('Hysteria2, TUIC', 'Ядро для них выбирается после технического спайка', '[ЯДРО]'),
        s('Журнал ядра', 'Уровень подробности логов.', ['Предупреждения', 'Информация', 'Отладка'])
      ]) },
      { title: 'TUN (режим VPN)', rows: sep([
        s('Стек TUN', 'Как обрабатываются пакеты.', ['Системный', 'gVisor', 'Смешанный']),
        s('MTU', 'Уменьшите при обрывах и зависаниях страниц.', ['Авто', '1500', '1420', '1280', 'Своё…']),
        t('strict', 'Строгие маршруты', 'Запрещает обход туннеля через другие адаптеры.'),
        t('sniff', 'Определение домена (sniffing)', 'Нужно для правил маршрутизации по доменам.')
      ]) },
      { title: 'Соединение', rows: sep([
        s('Отпечаток TLS (uTLS)', 'Как клиент выглядит для сети.', ['Из профиля', 'chrome', 'firefox', 'safari', 'random']),
        t('mux', 'Мультиплексирование (Mux)', 'Меньше соединений, но выше задержка при потерях.'),
        t('frag', 'TLS-фрагментация', 'Помогает против некоторых DPI. Может замедлить соединение.'),
        s('Таймаут подключения', 'Сколько ждать ответа сервера.', ['10 с', '5 с', '20 с', '30 с']),
        s('Переподключение', 'Только к выбранному серверу.', ['Экспоненц. до 60 с', 'До 5 минут', 'Не повторять'])
      ]) },
      { title: 'Режим прокси', rows: sep([
        i('Локальный порт', 'HTTP + SOCKS5 (mixed)', '[ПОРТ]'),
        t('lanProxy', 'Разрешить подключения из локальной сети', 'Другие устройства смогут использовать прокси.')
      ]) }
    ];
    const ICONS = {
      home: { shape: 'M4 5.5A1.5 1.5 0 0 1 5.5 4h3A1.5 1.5 0 0 1 10 5.5v3A1.5 1.5 0 0 1 8.5 10h-3A1.5 1.5 0 0 1 4 8.5zM14 5.5A1.5 1.5 0 0 1 15.5 4h3A1.5 1.5 0 0 1 20 5.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 14 8.5zM4 15.5A1.5 1.5 0 0 1 5.5 14h3a1.5 1.5 0 0 1 1.5 1.5v3A1.5 1.5 0 0 1 8.5 20h-3A1.5 1.5 0 0 1 4 18.5zM14 15.5a1.5 1.5 0 0 1 1.5-1.5h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3a1.5 1.5 0 0 1-1.5-1.5z', detail: 'M-9 -9' },
      servers: { shape: 'M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 15a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z', detail: 'M7.2 7.5h1M7.2 16.5h1M11.5 7.5h5M11.5 16.5h5' },
      diag: { shape: 'M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z', detail: 'M6.5 12.5h2.4l1.7-4 2.6 7.5 1.8-3.5h2.5' },
      settings: { shape: 'M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z', detail: 'M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z' }
    };
    const item = (id, label, href) => {
      const active = id === 'settings';
      return {
        label, href, shape: ICONS[id].shape, detail: ICONS[id].detail, cur: active ? 'page' : 'false',
        fill: active ? 'rgba(37, 99, 235, 0.16)' : 'none',
        color: active ? '#2563EB' : '#4B5565', weight: active ? 600 : 500
      };
    };
    return {
      groups,
      navL: [item('home', 'Главная', 'Main.dc.html'), item('servers', 'Серверы', 'Servers.dc.html')],
      navR: [item('diag', 'Проверка', 'Diagnostics.dc.html'), item('settings', 'Настройки', 'Settings.dc.html')]
    };
  }
}
</script>
</body>
</html>
