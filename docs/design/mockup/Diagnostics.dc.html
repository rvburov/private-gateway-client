<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Проверка — Private Gateway Client</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF2F8;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
a{color:#2563EB}a:hover{color:#1D4ED8}
button:focus,a:focus{outline:none}
button:focus-visible,a:focus-visible{outline:2px solid #93C5FD;outline-offset:2px}
.pg-nav:hover{color:#0B0F19}
.pg-noscroll{scrollbar-width:none;-ms-overflow-style:none}
.pg-noscroll::-webkit-scrollbar{display:none}
.pg-noscroll>*{flex-shrink:0}
.pg-spin{animation:pg-spin .9s linear infinite}
@keyframes pg-spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="position: relative; width: 440px; height: 1000px; overflow: hidden; background: #EEF2F8; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #0B0F19">
  <div aria-hidden="true" style="position: absolute; left: -80px; top: -60px; width: 300px; height: 300px; border-radius: 50%; background: #93C5FD; opacity: 0.55"></div>
  <div aria-hidden="true" style="position: absolute; right: -90px; top: 380px; width: 280px; height: 280px; border-radius: 50%; background: #86EFAC; opacity: 0.45"></div>
  <div aria-hidden="true" style="position: absolute; left: 40px; bottom: -120px; width: 320px; height: 260px; border-radius: 50%; background: #C4B5FD; opacity: 0.45"></div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; background: rgba(246, 248, 252, 0.7); backdrop-filter: blur(48px) saturate(170%); -webkit-backdrop-filter: blur(48px) saturate(170%)">
    <header style="display: flex; align-items: center; height: 60px; padding: 0 20px; flex: 0 0 auto">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.015em">Проверка</h1>
    </header>

    <div class="pg-noscroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px 160px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" onClick="{{run}}" style="height: 46px; border-radius: 14px; border: none; background: #2563EB; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 16px rgba(37, 99, 235, 0.26)">
          <svg class="{{spin}}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"></path><path d="M20 4v5h-5"></path></svg>{{runLabel}}</button>
        <button type="button" style="height: 46px; border-radius: 14px; border: 1px solid rgba(15, 23, 42, 0.12); background: rgba(255, 255, 255, 0.88); color: #0B0F19; font: inherit; font-weight: 500; cursor: pointer">Экспорт отчёта</button>
      </div>
      <p style="margin: 0 6px; font-size: 12px; color: #4B5565; line-height: 1.45">Проверки только читают состояние и ничего не меняют. Отчёт обезличен: без ключей, UUID, адресов подписок и названия вашей сети.</p>

      <section aria-label="Результаты" style="background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(15, 23, 42, 0.08); border-radius: 20px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06); padding: 4px 16px">
        <sc-for list="{{checks}}" as="c" hint-placeholder-count="8">
          <div style="display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: {{c.sep}}">
            <span style="width: 22px; height: 22px; border-radius: 50%; background: {{c.dot}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>
            </span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-weight: 600">{{c.k}}</span>
              <span style="font-size: 12px; color: #4B5565">{{c.d}}</span>
            </span>
            <span style="flex: 0 0 auto; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: {{c.bg}}; color: {{c.fg}}">{{c.s}}</span>
          </div>
        </sc-for>
      </section>

      <section aria-label="Журнал" style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin: 0 6px">
          <h2 style="margin: 0; font-size: 11px; font-weight: 600; color: #4B5565; text-transform: uppercase; letter-spacing: 0.06em">Журнал</h2>
          <span style="font-size: 12px; color: #4B5565">секреты скрыты</span>
        </div>
        <div style="background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(15, 23, 42, 0.08); border-radius: 18px; padding: 12px 14px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; line-height: 1.8; overflow: hidden; color: #1F2937; display: flex; flex-direction: column">
          <sc-for list="{{logs}}" as="l" hint-placeholder-count="7">
            <div style="white-space: pre; overflow: hidden; text-overflow: ellipsis"><span style="color: #4B5565">{{l.t}}</span>  <span style="color: {{l.c}}; font-weight: 600">{{l.lv}}</span>  {{l.m}}</div>
          </sc-for>
        </div>
      </section>
    </div>

    <footer style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; pointer-events: none">
      <svg width="440" height="150" viewBox="0 0 440 150" aria-hidden="true" style="position: absolute; left: 0; top: 0; display: block; overflow: visible; filter: drop-shadow(0 6px 18px rgba(15, 23, 42, 0.14))"><path d="M50 70 H156.5 A18 18 0 0 0 173.82 56.91 A48 48 0 0 1 266.18 56.91 A18 18 0 0 0 283.5 70 H390 A26 26 0 0 1 416 96 V112 A26 26 0 0 1 390 138 H50 A26 26 0 0 1 24 112 V96 A26 26 0 0 1 50 70 Z" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.06)" stroke-width="1" style="pointer-events: auto"></path></svg>
      <nav aria-label="Главное меню" style="position: absolute; left: 24px; right: 24px; top: 70px; bottom: 12px; display: grid; grid-template-columns: 1fr 1fr 92px 1fr 1fr; padding: 0 12px 9px; pointer-events: auto">
        <sc-for list="{{navL}}" as="n" hint-placeholder-count="2">
          <a href="{{n.href}}" class="pg-nav" aria-current="{{n.cur}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; text-decoration: none; color: {{n.color}}; font-size: 11.5px; font-weight: {{n.weight}}; line-height: 14px">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.shape}}" fill="{{n.fill}}"></path><path d="{{n.detail}}"></path></svg>
            {{n.label}}
          </a>
        </sc-for>
        <span style="display: flex; align-items: flex-end; justify-content: center; font-size: 12px; line-height: 14px; font-weight: 700; color: #15803D">Защищено</span>
        <sc-for list="{{navR}}" as="n" hint-placeholder-count="2">
          <a href="{{n.href}}" class="pg-nav" aria-current="{{n.cur}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; text-decoration: none; color: {{n.color}}; font-size: 11.5px; font-weight: {{n.weight}}; line-height: 14px">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.shape}}" fill="{{n.fill}}"></path><path d="{{n.detail}}"></path></svg>
            {{n.label}}
          </a>
        </sc-for>
      </nav>
      <button type="button" aria-label="Отключить VPN" style="position: absolute; top: 30px; left: 180px; width: 80px; height: 80px; border-radius: 50%; border: 4px solid #16A34A; background: #FFFFFF; color: #15803D; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25); pointer-events: auto">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l7.5 3v5.4c0 4.7-3.1 8.6-7.5 10-4.4-1.4-7.5-5.3-7.5-10V5.8z"></path><path d="M8.8 12.2l2.2 2.2 4.4-4.6"></path></svg>
      </button>
    </footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":1000}}'>
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this.rt); }
  renderVals() {
    const ui = this.state || {};
    const running = !!ui.running;
    const CHECK = 'M5 12.5l4.5 4.5L19 7.5', WARN = 'M12 7v6M12 17h.01', DOTS = 'M7 12h.01M12 12h.01M17 12h.01';
    const ok = (k, d, s) => ({ k, d, s, dot: running ? '#3B82F6' : '#16A34A', icon: running ? DOTS : CHECK, bg: running ? 'rgba(37, 99, 235, 0.10)' : 'rgba(22, 163, 74, 0.10)', fg: running ? '#1E40AF' : '#166534' });
    const warn = (k, d, s) => ({ k, d, s, dot: running ? '#3B82F6' : '#EA580C', icon: running ? DOTS : WARN, bg: running ? 'rgba(37, 99, 235, 0.10)' : 'rgba(234, 88, 12, 0.10)', fg: running ? '#1E40AF' : '#9A3412' });
    const list = [
      ok('Служба', 'Работает, канал связи с интерфейсом защищён', 'OK'),
      ok('Сетевое ядро', 'Xray-core запущен, конфигурация применена', 'OK'),
      ok('Весь трафик', 'TUN-адаптер активен, маршрут по умолчанию → туннель', 'OK'),
      ok('Блок при обрыве', 'Фильтры брандмауэра Windows активны', 'OK'),
      ok('DNS', 'Запросов к DNS провайдера нет', 'Нет утечек'),
      ok('IPv6', 'Заблокирован вне туннеля', 'Закрыт'),
      ok('IP для сайтов', '203.0.113.24 · Амстердам · дата-центр', 'Скрыт'),
      warn('Другие VPN и прокси', 'Найден системный прокси другой программы', 'Внимание')
    ];
    const checks = list.map((c, idx) => Object.assign(c, { s: running ? '…' : c.s, sep: idx === list.length - 1 ? 'none' : '1px solid rgba(15, 23, 42, 0.07)' }));
    const I = '#1D4ED8', W = '#9A3412';
    const logs = [
      { t: '18:42:10', lv: 'INF', c: I, m: 'tunnel up  server=NL-01  uuid=••••' },
      { t: '18:42:08', lv: 'INF', c: I, m: 'killswitch on  allow=203.0.113.24' },
      { t: '18:42:08', lv: 'INF', c: I, m: 'route v4/v6 default -> tun' },
      { t: '18:42:07', lv: 'INF', c: I, m: 'net up  wifi «•••»  v4+v6' },
      { t: '18:41:55', lv: 'WRN', c: W, m: 'sub «Тест»: HTTP 403, kept old' },
      { t: '18:41:54', lv: 'INF', c: I, m: 'sub «Основная» updated: 24' },
      { t: '18:41:50', lv: 'INF', c: I, m: 'service started  ipc=ok' }
    ];
    const ICONS = {
      home: { shape: 'M4 5.5A1.5 1.5 0 0 1 5.5 4h3A1.5 1.5 0 0 1 10 5.5v3A1.5 1.5 0 0 1 8.5 10h-3A1.5 1.5 0 0 1 4 8.5zM14 5.5A1.5 1.5 0 0 1 15.5 4h3A1.5 1.5 0 0 1 20 5.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 14 8.5zM4 15.5A1.5 1.5 0 0 1 5.5 14h3a1.5 1.5 0 0 1 1.5 1.5v3A1.5 1.5 0 0 1 8.5 20h-3A1.5 1.5 0 0 1 4 18.5zM14 15.5a1.5 1.5 0 0 1 1.5-1.5h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3a1.5 1.5 0 0 1-1.5-1.5z', detail: 'M-9 -9' },
      servers: { shape: 'M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 15a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z', detail: 'M7.2 7.5h1M7.2 16.5h1M11.5 7.5h5M11.5 16.5h5' },
      diag: { shape: 'M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z', detail: 'M6.5 12.5h2.4l1.7-4 2.6 7.5 1.8-3.5h2.5' },
      settings: { shape: 'M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z', detail: 'M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z' }
    };
    const item = (id, label, href) => {
      const active = id === 'diag';
      return {
        label, href, shape: ICONS[id].shape, detail: ICONS[id].detail, cur: active ? 'page' : 'false',
        fill: active ? 'rgba(37, 99, 235, 0.16)' : 'none',
        color: active ? '#2563EB' : '#4B5565', weight: active ? 600 : 500
      };
    };
    return {
      checks, logs,
      spin: running ? 'pg-spin' : '',
      runLabel: running ? 'Проверяем…' : 'Проверить',
      run: () => { clearTimeout(this.rt); this.setState({ running: true }); this.rt = setTimeout(() => this.setState({ running: false }), 1400); },
      navL: [item('home', 'Главная', 'Main.dc.html'), item('servers', 'Серверы', 'Servers.dc.html')],
      navR: [item('diag', 'Проверка', 'Diagnostics.dc.html'), item('settings', 'Настройки', 'Settings.dc.html')]
    };
  }
}
</script>
</body>
</html>
