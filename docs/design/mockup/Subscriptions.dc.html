<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Профили и подписки — Private Gateway Client</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF2F8;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
a{color:#2563EB}a:hover{color:#1D4ED8}
button:focus,a:focus{outline:none}
button:focus-visible,a:focus-visible{outline:2px solid #93C5FD;outline-offset:2px}
.pg-ib:hover{background:rgba(15,23,42,.06)}
.pg-nav:hover{color:#0B0F19}
.pg-noscroll{scrollbar-width:none;-ms-overflow-style:none}
.pg-noscroll::-webkit-scrollbar{display:none}
.pg-noscroll>*{flex-shrink:0}
.pg-spin{animation:pg-spin .9s linear infinite}
@keyframes pg-spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="position: relative; width: 440px; height: 760px; overflow: hidden; background: #EEF2F8; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #0B0F19">
  <div aria-hidden="true" style="position: absolute; left: -80px; top: -60px; width: 300px; height: 300px; border-radius: 50%; background: #93C5FD; opacity: 0.55"></div>
  <div aria-hidden="true" style="position: absolute; right: -90px; top: 250px; width: 280px; height: 280px; border-radius: 50%; background: #86EFAC; opacity: 0.45"></div>
  <div aria-hidden="true" style="position: absolute; left: 40px; bottom: -120px; width: 320px; height: 260px; border-radius: 50%; background: #C4B5FD; opacity: 0.45"></div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; background: rgba(246, 248, 252, 0.7); backdrop-filter: blur(48px) saturate(170%); -webkit-backdrop-filter: blur(48px) saturate(170%)">
    <header style="display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 12px; flex: 0 0 auto">
      <div style="display: flex; align-items: center; gap: 4px">
        <a href="Settings.dc.html" class="pg-ib" aria-label="Назад к настройкам" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #0B0F19">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
        </a>
        <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.015em">Профили и подписки</h1>
      </div>
      <a href="Import.dc.html" class="pg-ib" aria-label="Добавить подписку" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #0B0F19">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </a>
    </header>

    <div class="pg-noscroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px 160px; display: flex; flex-direction: column; gap: 14px">
      <section aria-label="Обновление" style="background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(15, 23, 42, 0.08); border-radius: 20px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06); padding: 2px 16px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid rgba(15, 23, 42, 0.07)">
          <span style="display: flex; flex-direction: column; gap: 3px">
            <span style="font-weight: 600">Автообновление</span>
            <span style="font-size: 12px; color: #4B5565">Как часто скачивать списки серверов</span>
          </span>
          <button type="button" style="height: 36px; padding: 0 10px 0 12px; border-radius: 10px; border: 1px solid rgba(15, 23, 42, 0.12); background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; color: #0B0F19; cursor: pointer; display: flex; align-items: center; gap: 6px">каждые 12 ч<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
        </div>
        <sc-for list="{{opts}}" as="r" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: {{r.sep}}">
            <span style="display: flex; flex-direction: column; gap: 3px">
              <span style="font-weight: 600">{{r.k}}</span>
              <span style="font-size: 12px; color: #4B5565; line-height: 1.45">{{r.d}}</span>
            </span>
            <button type="button" role="switch" aria-checked="{{r.aria}}" aria-label="{{r.k}}" onClick="{{r.flip}}" style="{{r.sw}}"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.25)"></span></button>
          </div>
        </sc-for>
      </section>

      <h2 style="margin: 4px 6px -4px; font-size: 11px; font-weight: 600; color: #4B5565; text-transform: uppercase; letter-spacing: 0.06em">Подписки · 4</h2>
      <sc-for list="{{subs}}" as="s" hint-placeholder-count="4">
        <section aria-label="{{s.name}}" style="background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(15, 23, 42, 0.08); border-radius: 18px; padding: 14px 12px 12px 16px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: flex-start; gap: 10px">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <span style="font-weight: 700; font-size: 15px">{{s.name}}</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #4B5565; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.url}}</span>
            </span>
            <span style="flex: 0 0 auto; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: {{s.chipBg}}; color: {{s.chipFg}}">{{s.chip}}</span>
          </div>
          <span style="font-size: 12.5px; color: #374151">{{s.meta}}</span>
          <sc-if value="{{s.err}}" hint-placeholder-val="{{ false }}">
            <span style="padding: 8px 10px; border-radius: 10px; background: rgba(234, 88, 12, 0.08); border: 1px solid rgba(234, 88, 12, 0.18); color: #9A3412; font-size: 12px; line-height: 1.4">{{s.errText}}</span>
          </sc-if>
          <div style="display: flex; gap: 6px; margin-top: 2px">
            <sc-if value="{{s.canUpdate}}" hint-placeholder-val="{{ true }}">
              <button type="button" onClick="{{s.update}}" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(37, 99, 235, 0.22); background: rgba(37, 99, 235, 0.06); color: #1D4ED8; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px">
                <svg class="{{s.spin}}" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"></path><path d="M20 4v5h-5"></path></svg>Обновить</button>
            </sc-if>
            <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(15, 23, 42, 0.12); background: #FFFFFF; color: #0B0F19; font: inherit; font-size: 13px; cursor: pointer">Изменить</button>
            <span style="flex: 1"></span>
            <a href="Dialogs.dc.html" class="pg-ib" aria-label="Удалить {{s.name}}" style="width: 36px; height: 36px; border-radius: 10px; color: #B91C1C; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"></path></svg>
            </a>
          </div>
        </section>
      </sc-for>

      <a href="Import.dc.html" style="height: 46px; flex: 0 0 auto; border-radius: 14px; border: 1.5px dashed rgba(37, 99, 235, 0.45); background: rgba(37, 99, 235, 0.04); color: #1D4ED8; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Добавить подписку</a>
    </div>

    <footer style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; pointer-events: none">
      <svg width="440" height="150" viewBox="0 0 440 150" aria-hidden="true" style="position: absolute; left: 0; top: 0; display: block; overflow: visible; filter: drop-shadow(0 6px 18px rgba(15, 23, 42, 0.14))"><path d="M50 70 H156.5 A18 18 0 0 0 173.82 56.91 A48 48 0 0 1 266.18 56.91 A18 18 0 0 0 283.5 70 H390 A26 26 0 0 1 416 96 V112 A26 26 0 0 1 390 138 H50 A26 26 0 0 1 24 112 V96 A26 26 0 0 1 50 70 Z" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.06)" stroke-width="1" style="pointer-events: auto"></path></svg>
      <nav aria-label="Главное меню" style="position: absolute; left: 24px; right: 24px; top: 70px; bottom: 12px; display: grid; grid-template-columns: 1fr 1fr 92px 1fr 1fr; padding: 0 12px 9px; pointer-events: auto">
        <sc-for list="{{navL}}" as="n" hint-placeholder-count="2">
          <a href="{{n.href}}" class="pg-nav" aria-current="{{n.cur}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; text-decoration: none; color: {{n.color}}; font-size: 11.5px; font-weight: {{n.weight}}; line-height: 14px">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.shape}}" fill="{{n.fill}}"></path><path d="{{n.detail}}"></path></svg>
            {{n.label}}
          </a>
        </sc-for>
        <span style="display: flex; align-items: flex-end; justify-content: center; font-size: 12px; line-height: 14px; font-weight: 700; color: #15803D">Защищено</span>
        <sc-for list="{{navR}}" as="n" hint-placeholder-count="2">
          <a href="{{n.href}}" class="pg-nav" aria-current="{{n.cur}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; text-decoration: none; color: {{n.color}}; font-size: 11.5px; font-weight: {{n.weight}}; line-height: 14px">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.shape}}" fill="{{n.fill}}"></path><path d="{{n.detail}}"></path></svg>
            {{n.label}}
          </a>
        </sc-for>
      </nav>
      <button type="button" aria-label="Отключить VPN" style="position: absolute; top: 30px; left: 180px; width: 80px; height: 80px; border-radius: 50%; border: 4px solid #16A34A; background: #FFFFFF; color: #15803D; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25); pointer-events: auto">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l7.5 3v5.4c0 4.7-3.1 8.6-7.5 10-4.4-1.4-7.5-5.3-7.5-10V5.8z"></path><path d="M8.8 12.2l2.2 2.2 4.4-4.6"></path></svg>
      </button>
    </footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":760}}'>
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this.ut); }
  renderVals() {
    const ui = this.state || {};
    const def = { viaVpn: true, notify: true };
    const v = (id) => (ui[id] == null ? def[id] : ui[id]);
    const optDef = [
      ['viaVpn', 'Обновлять только через VPN', 'Провайдер не увидит адреса подписок'],
      ['notify', 'Сообщать об изменении выбранного сервера', 'Если он пропал или изменился после обновления']
    ];
    const opts = optDef.map(([id, k, d], i) => {
      const on = v(id);
      return {
        k, d, aria: on ? 'true' : 'false', sep: i === optDef.length - 1 ? 'none' : '1px solid rgba(15, 23, 42, 0.07)',
        sw: 'flex: 0 0 auto; width: 48px; height: 28px; border-radius: 999px; border: none; padding: 3px; cursor: pointer; display: flex; ' + (on ? 'background: #2563EB; justify-content: flex-end;' : 'background: #C3CAD6; justify-content: flex-start;'),
        flip: () => this.setState({ [id]: !on })
      };
    });
    const OK = { chip: 'Работает', chipBg: 'rgba(22, 163, 74, 0.12)', chipFg: '#166534' };
    const ERR = { chip: 'Ошибка', chipBg: 'rgba(234, 88, 12, 0.12)', chipFg: '#9A3412' };
    const MAN = { chip: 'Вручную', chipBg: 'rgba(15, 23, 42, 0.06)', chipFg: '#374151' };
    const SUBS = [
      Object.assign({ id: 'main', name: 'Основная', url: 'https://example.com/sub/••••••••', meta: '24 сервера · обновлено в 18:10', canUpdate: true, err: false }, OK),
      Object.assign({ id: 'res', name: 'Резервная', url: 'https://example.org/clash/••••', meta: '8 серверов · обновлено вчера', canUpdate: true, err: false }, OK),
      Object.assign({ id: 'test', name: 'Тестовый стенд', url: 'file://…/sing-box-test.json', meta: '3 сервера · последняя попытка 2 ч назад', canUpdate: true, err: true, errText: 'Сервер ответил HTTP 403. Оставлена прошлая версия списка — серверы работают.' }, ERR),
      Object.assign({ id: 'own', name: 'Мои серверы', url: 'добавлены вручную по ссылкам', meta: '1 сервер', canUpdate: false, err: false }, MAN)
    ];
    const busy = ui.busy || null;
    const subs = SUBS.map((s) => Object.assign({}, s, {
      spin: busy === s.id ? 'pg-spin' : '',
      update: () => { clearTimeout(this.ut); this.setState({ busy: s.id }); this.ut = setTimeout(() => this.setState({ busy: null }), 1100); }
    }));
    const ICONS = {
      home: { shape: 'M4 5.5A1.5 1.5 0 0 1 5.5 4h3A1.5 1.5 0 0 1 10 5.5v3A1.5 1.5 0 0 1 8.5 10h-3A1.5 1.5 0 0 1 4 8.5zM14 5.5A1.5 1.5 0 0 1 15.5 4h3A1.5 1.5 0 0 1 20 5.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 14 8.5zM4 15.5A1.5 1.5 0 0 1 5.5 14h3a1.5 1.5 0 0 1 1.5 1.5v3A1.5 1.5 0 0 1 8.5 20h-3A1.5 1.5 0 0 1 4 18.5zM14 15.5a1.5 1.5 0 0 1 1.5-1.5h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3a1.5 1.5 0 0 1-1.5-1.5z', detail: 'M-9 -9' },
      servers: { shape: 'M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 15a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z', detail: 'M7.2 7.5h1M7.2 16.5h1M11.5 7.5h5M11.5 16.5h5' },
      diag: { shape: 'M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z', detail: 'M6.5 12.5h2.4l1.7-4 2.6 7.5 1.8-3.5h2.5' },
      settings: { shape: 'M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z', detail: 'M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z' }
    };
    const item = (id, label, href) => {
      const active = id === 'settings';
      return {
        label, href, shape: ICONS[id].shape, detail: ICONS[id].detail, cur: active ? 'page' : 'false',
        fill: active ? 'rgba(37, 99, 235, 0.16)' : 'none',
        color: active ? '#2563EB' : '#4B5565', weight: active ? 600 : 500
      };
    };
    return {
      opts, subs,
      navL: [item('home', 'Главная', 'Main.dc.html'), item('servers', 'Серверы', 'Servers.dc.html')],
      navR: [item('diag', 'Проверка', 'Diagnostics.dc.html'), item('settings', 'Настройки', 'Settings.dc.html')]
    };
  }
}
</script>
</body>
</html>
