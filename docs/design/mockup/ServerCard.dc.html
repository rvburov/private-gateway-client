<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карточка сервера — Private Gateway Client</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF2F8;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
a{color:#2563EB}a:hover{color:#1D4ED8}
button:focus,a:focus{outline:none}
button:focus-visible,a:focus-visible{outline:2px solid #93C5FD;outline-offset:2px}
.pg-ib:hover{background:rgba(15,23,42,.06)}
.pg-act:hover{background:rgba(15,23,42,.04)}
</style>
</helmet>
<div style="position: relative; width: 440px; height: 760px; overflow: hidden; background: #EEF2F8; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #0B0F19">
  <div aria-hidden="true" style="position: absolute; left: -80px; top: -60px; width: 300px; height: 300px; border-radius: 50%; background: #93C5FD; opacity: 0.55"></div>
  <div aria-hidden="true" style="position: absolute; right: -90px; top: 250px; width: 280px; height: 280px; border-radius: 50%; background: #86EFAC; opacity: 0.45"></div>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(246, 248, 252, 0.7); backdrop-filter: blur(48px) saturate(170%); -webkit-backdrop-filter: blur(48px) saturate(170%); padding: 16px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 22px; font-weight: 700; padding: 4px 0 8px">Серверы</div>
    <div style="height: 46px; border-radius: 14px; background: rgba(255, 255, 255, 0.9)"></div>
    <div style="height: 44px; border-radius: 12px; background: rgba(15, 23, 42, 0.05)"></div>
    <div style="height: 58px; border-radius: 14px; background: #FFFFFF; border: 1.5px solid #16A34A"></div>
    <div style="height: 58px; border-radius: 14px; background: rgba(255, 255, 255, 0.82)"></div>
    <div style="height: 58px; border-radius: 14px; background: rgba(255, 255, 255, 0.82)"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(15, 23, 42, 0.32)"></div>

  <section role="dialog" aria-label="Сервер Нидерланды 01" style="position: absolute; left: 0; right: 0; bottom: 0; top: 92px; border-radius: 26px 26px 0 0; background: rgba(255, 255, 255, 0.98); box-shadow: 0 -12px 40px rgba(15, 23, 42, 0.20); padding: 10px 20px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #C3CAD6"></span>

    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 52px; height: 38px; border-radius: 10px; background: rgba(37, 99, 235, 0.10); border: 1px solid rgba(37, 99, 235, 0.16); color: #1D4ED8; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; letter-spacing: 0.04em; flex: 0 0 auto">NL</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.015em">Нидерланды 01</span>
        <span style="font-size: 12.5px; color: #4B5565">Амстердам · из подписки «Основная»</span>
      </span>
      <button type="button" class="pg-ib" onClick="{{toggleFav}}" aria-pressed="{{favAria}}" aria-label="{{favLabel}}" style="width: 40px; height: 40px; border: none; border-radius: 12px; background: transparent; color: {{favColor}}; cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="{{favFill}}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"></path></svg>
      </button>
      <a href="Servers.dc.html" class="pg-ib" aria-label="Закрыть" style="width: 40px; height: 40px; border-radius: 12px; color: #374151; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; background: rgba(22, 163, 74, 0.12); color: #166534; font-size: 12.5px; font-weight: 600"><span style="width: 7px; height: 7px; border-radius: 50%; background: #16A34A"></span>Активен</span>
      <span style="display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 8px; background: rgba(15, 23, 42, 0.05); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 600; color: #15803D">42 мс</span>
      <span style="font-size: 12px; color: #4B5565">проверено в 18:42</span>
    </div>

    <sc-if value="{{noShare}}" hint-placeholder-val="{{ true }}">
      <div style="padding: 12px 14px 8px; border-radius: 16px; background: rgba(15, 23, 42, 0.03); border: 1px solid rgba(15, 23, 42, 0.06)">
        <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: #4B5565; text-transform: uppercase; letter-spacing: 0.06em"><span>Пинг за 10 минут</span><span style="font-family: 'JetBrains Mono', monospace; text-transform: none; letter-spacing: 0">38–51 мс</span></div>
        <svg width="100%" height="48" viewBox="0 0 360 48" preserveAspectRatio="none" aria-hidden="true" style="display: block; margin-top: 6px"><path d="M0 30 L36 26 L72 32 L108 22 L144 28 L180 18 L216 24 L252 20 L288 30 L324 24 L360 26" fill="none" stroke="#16A34A" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path><path d="M0 30 L36 26 L72 32 L108 22 L144 28 L180 18 L216 24 L252 20 L288 30 L324 24 L360 26 L360 48 L0 48 Z" fill="rgba(22, 163, 74, 0.10)"></path></svg>
      </div>

      <dl style="margin: 0; padding: 2px 14px; border-radius: 16px; background: rgba(15, 23, 42, 0.03); border: 1px solid rgba(15, 23, 42, 0.06)">
        <sc-for list="{{details}}" as="d" hint-placeholder-count="7">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: {{d.sep}}">
            <dt style="color: #4B5565; font-size: 13px">{{d.k}}</dt>
            <dd style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 500; color: #0B0F19; text-align: right">{{d.v}}</dd>
          </div>
        </sc-for>
      </dl>
    </sc-if>

    <sc-if value="{{share}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 16px; border-radius: 16px; background: rgba(15, 23, 42, 0.03); border: 1px solid rgba(15, 23, 42, 0.06); display: flex; flex-direction: column; align-items: center; gap: 12px">
        <svg width="168" height="168" viewBox="0 0 21 21" shape-rendering="crispEdges" role="img" aria-label="QR-код с ссылкой на сервер" style="background: #FFFFFF; padding: 10px; border-radius: 12px; border: 1px solid rgba(15, 23, 42, 0.08)"><path fill="#0B0F19" d="M0 0h7v7H0zM1 1v5h5V1zM2 2h3v3H2zM14 0h7v7h-7zM15 1v5h5V1zM16 2h3v3h-3zM0 14h7v7H0zM1 15v5h5v-5zM2 16h3v3H2zM8 0h1v1H8zM10 0h2v1h-2zM9 2h2v1H9zM8 4h1v2H8zM11 4h2v1h-2zM10 6h1v2h-1zM12 7h2v1h-2zM8 8h2v1H8zM0 8h2v1H0zM3 8h1v2H3zM5 9h2v1H5zM15 8h2v1h-2zM18 8h3v1h-3zM9 10h3v1H9zM14 10h1v2h-1zM17 10h2v1h-2zM1 11h3v1H1zM6 11h2v1H6zM11 12h2v1h-2zM16 12h1v2h-1zM19 12h2v1h-2zM8 13h2v1H8zM13 14h2v1h-2zM9 15h1v2H9zM11 16h3v1h-3zM16 15h2v1h-2zM19 16h2v2h-2zM8 18h2v1H8zM12 18h1v3h-1zM14 19h3v1h-3zM18 19h1v2h-1zM10 20h1v1h-1z"></path></svg>
        <p style="margin: 0; padding: 10px 12px; border-radius: 12px; background: rgba(234, 88, 12, 0.08); border: 1px solid rgba(234, 88, 12, 0.18); color: #9A3412; font-size: 12.5px; line-height: 1.45">В ссылке есть ключ доступа к серверу. Делитесь только с теми, кому доверяете.</p>
        <button type="button" style="width: 100%; height: 44px; border-radius: 12px; border: 1px solid rgba(37, 99, 235, 0.25); background: rgba(37, 99, 235, 0.06); color: #1D4ED8; font: inherit; font-weight: 600; cursor: pointer">Копировать ссылку</button>
      </div>
    </sc-if>

    <div style="flex: 1"></div>

    <button type="button" disabled style="height: 50px; border-radius: 14px; border: 1.5px solid rgba(22, 163, 74, 0.35); background: rgba(22, 163, 74, 0.08); color: #166534; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Используется сейчас</button>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button type="button" class="pg-act" style="height: 58px; border-radius: 14px; border: 1px solid rgba(15, 23, 42, 0.10); background: #FFFFFF; font: inherit; font-size: 12.5px; color: #0B0F19; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"></path></svg>Переименовать</button>
      <button type="button" class="pg-act" onClick="{{toggleShare}}" aria-pressed="{{shareAria}}" style="height: 58px; border-radius: 14px; border: 1px solid {{shareBorder}}; background: {{shareBg}}; font: inherit; font-size: 12.5px; color: {{shareFg}}; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2M14 18v2M18 18h2v2"></path></svg>{{shareLabel}}</button>
      <a href="Dialogs.dc.html" class="pg-act" style="height: 58px; box-sizing: border-box; border-radius: 14px; border: 1px solid rgba(220, 38, 38, 0.25); background: #FFFFFF; font-size: 12.5px; color: #B91C1C; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"></path></svg>Удалить</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const ui = this.state || {};
    const fav = ui.fav == null ? true : ui.fav;
    const share = !!ui.share;
    const rows = [
      ['Адрес', '203.0.113.24:443'],
      ['Протокол', 'VLESS'],
      ['Транспорт', 'TCP'],
      ['Защита', 'REALITY'],
      ['Маскировка (SNI)', 'www.example.com'],
      ['Отпечаток TLS', 'chrome'],
      ['Ядро', 'Xray-core']
    ];
    const details = rows.map(([k, v], i) => ({ k, v, sep: i === rows.length - 1 ? 'none' : '1px solid rgba(15, 23, 42, 0.07)' }));
    return {
      details, share, noShare: !share,
      favAria: fav ? 'true' : 'false', favLabel: fav ? 'Убрать из избранного' : 'В избранное',
      favColor: fav ? '#D97706' : '#4B5565', favFill: fav ? '#FBBF24' : 'none',
      toggleFav: () => this.setState({ fav: !fav }),
      shareAria: share ? 'true' : 'false', shareLabel: share ? 'Скрыть QR' : 'Поделиться',
      shareBorder: share ? '#2563EB' : 'rgba(15, 23, 42, 0.10)', shareBg: share ? 'rgba(37, 99, 235, 0.06)' : '#FFFFFF', shareFg: share ? '#1D4ED8' : '#0B0F19',
      toggleShare: () => this.setState({ share: !share })
    };
  }
}
</script>
</body>
</html>
