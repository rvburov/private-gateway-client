# Проект Xcode приложения iOS — генерирует XcodeGen (scripts/ios-project.sh), сам проект в git не хранится.
# Приложение (SwiftUI) и расширение туннеля (Packet Tunnel) берут общий пакет ios/Core: разбор, конфиг ядра — из
# PrivateGatewayCore, тема и тексты — из PrivateGatewayTheme (их пишет плагин сборки из shared/specifications). Ядро Xray
# расширения — ios/Frameworks/LibXray.xcframework (scripts/get-libxray-ios.sh, в git не хранится).
# Подписи нет (аккаунта Apple Developer нет, решение 2026-10-25): сборка и тесты — на симуляторе.
name: PrivateGateway
options:
  bundleIdPrefix: com.privategateway
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  PrivateGatewayCore:
    path: Core
targets:
  PrivateGateway:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      # Общее с расширением туннеля: уведомления (тексты, кнопки, показ).
      - path: Shared
      # «Лицензии открытых компонентов»: список и тексты лицензий — те же файлы, что сверяют тесты; коммит libXray — общий
      # с Android. Тексты — папкой (texts/<SPDX>.txt в пакете приложения).
      - path: ../shared/licenses/ios.json
        buildPhase: resources
      - path: ../shared/licenses/texts
        type: folder
        buildPhase: resources
      - path: ../android/libxray.version
        buildPhase: resources
    dependencies:
      - package: PrivateGatewayCore
        product: PrivateGatewayCore
      - package: PrivateGatewayCore
        product: PrivateGatewayTheme
      - target: PacketTunnel
      # Ядро в приложении — только для замера задержки без защиты (pingBatch, решение 468): тот же libXray, что в
      # расширении туннеля, вшивается в приложение отдельно.
      - framework: Frameworks/LibXray.xcframework
        embed: false
      - sdk: libresolv.tbd
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Private Gateway
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ru]
        UILaunchScreen: {}
        # Камера — только для QR-кода со ссылкой на сервер; текст по языкам — App/Resources/*.lproj/InfoPlist.strings.
        NSCameraUsageDescription: The camera is used only to read a QR code with a server link. Nothing is saved or sent anywhere.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Обновление подписок без окна (BackgroundRefresh): iOS будит приложение сама, когда сочтет нужным.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.privategateway.client.refresh]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: App/PrivateGateway.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.privategateway.client]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privategateway.client
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel/Sources
      - path: Shared
    dependencies:
      - package: PrivateGatewayCore
        product: PrivateGatewayCore
      - package: PrivateGatewayCore
        product: PrivateGatewayTheme
      - sdk: NetworkExtension.framework
      # Ядро Xray — libXray, собранный gomobile (scripts/get-libxray-ios.sh): статическая библиотека, вшивается в расширение,
      # отдельно не встраивается. libresolv — для разрешения имен Go (адрес сервера).
      - framework: Frameworks/LibXray.xcframework
        embed: false
      - sdk: libresolv.tbd
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: Private Gateway
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.privategateway.client]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privategateway.client.tunnel
  PrivateGatewayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: PrivateGateway
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privategateway.client.tests
schemes:
  PrivateGateway:
    build:
      targets:
        PrivateGateway: all
        PrivateGatewayTests: [test]
    test:
      targets:
        - PrivateGatewayTests
