name: Проверка

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Сборка и тесты (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v5

      # Новейший SDK 10.0 по global.json. Свежий выпуск бывает уже объявлен, а файлы у Microsoft еще не готовы
      # (ответ 409 на всех ОС, 2026-10-25), — тогда предыдущий выпуск: global.json берет любой 10.0.
      - id: dotnet
        uses: actions/setup-dotnet@v5
        continue-on-error: true
        with:
          global-json-file: global.json

      - if: steps.dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.402

      - name: Сборка
        run: dotnet build PrivateGateway.slnx -c Release

      # Ядро Xray для прокси-теста на localhost (desktop/tests/Network): версия и SHA-256 — в shared/cores.
      - name: Ядро Xray
        shell: bash
        run: scripts/get-xray.sh

      # sing-box — TUN режима VPN (отдельный процесс, GPL-3.0): версия и SHA-256 — в shared/cores.
      - name: TUN sing-box
        shell: bash
        run: scripts/get-singbox.sh

      - name: Тесты
        run: dotnet test --solution PrivateGateway.slnx -c Release --no-build

      # Проба: закрывают ли фильтры пересылки WFP контейнер Windows за NAT (WinNAT, как у Docker и WSL). Образ —
      # nanoserver под сборку раннера; итог — в журнале шага. Не загрузился образ — проба пропускается.
      - name: Проба пересылки WFP (контейнер за NAT)
        if: runner.os == 'Windows'
        shell: bash
        env:
          PG_FORWARD_PROBE: '1'
        run: |
          docker pull mcr.microsoft.com/windows/nanoserver:ltsc2025 || echo 'образ не загрузился — проба пропустится'
          status=0
          dotnet test --project desktop/tests/Network -c Release --no-build -- --filter-method '*Probe_container_behind_nat_and_the_forward_filters' || status=$?
          cat artifacts/forward-probe.txt || echo 'итога пробы нет'
          exit $status

      # На Linux хранилища секретов без рабочего стола нет — поднимаем GNOME Keyring в своей сессии.
      - name: Хранилище секретов Linux (Secret Service)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring libsecret-1-0 dbus
          dbus-run-session -- scripts/tests/secret-service.sh -c Release --no-build

      # Тесты в своих сетевых пространствах Linux (TUN sing-box, nftables, блок при обрыве, systemd-creds) — от root:
      # без него они пропускаются. Правила и TUN ставятся только внутри своих пространств, машина CI их не видит.
      # Последним шагом: файлы результатов от root не мешают шагам без него.
      - name: Сетевые пространства Linux (root)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables
          sudo env "PATH=$PATH" "DOTNET_ROOT=$DOTNET_ROOT" "HOME=$HOME" DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 \
            dotnet test --project desktop/tests/Network -c Release --no-build -- \
            --filter-class '*.VpnTunnelTests' --filter-class '*.VpnModeTests' --filter-class '*.KillSwitchTests' \
            --filter-class '*.RouteTableTests' --filter-class '*.BootConnectionTests'

  worktree:
    name: Рабочие папки агентов (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # На Windows — Git Bash: скрипты проекта запускаются в нем (AGENTS.md).
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: scripts/worktree.sh на временном репозитории
        run: scripts/tests/worktree-smoke.sh

  secrets:
    name: Секреты в репозитории
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
