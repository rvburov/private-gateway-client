name: Проверка

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Новый коммит в ветку отменяет ее незаконченную проверку: та проверяет уже прежний код и держит машины CI, которых мало
# (macOS — меньше всего). Проверки master не отменяются: по каждой видно, зеленый ли этот коммит master.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  style:
    name: Стиль и формат
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Как в сборке: свежий выпуск SDK бывает объявлен раньше, чем готовы файлы, — тогда предыдущий.
      - id: dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        continue-on-error: true
        with:
          global-json-file: global.json

      - if: steps.dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.402

      # .editorconfig и анализаторы: пробелы, порядок using, имена, стиль. Исправить у себя — dotnet format PrivateGateway.slnx.
      - name: dotnet format
        run: dotnet format PrivateGateway.slnx --verify-no-changes

      - name: Отчет о тестах на собранных отчетах
        run: scripts/tests/test-report-smoke.sh

      - name: Сборка выпуска на собранных сборках
        run: scripts/tests/release-assembly-smoke.sh

      - name: Условия выпуска и отказы удаления пакета
        run: |
          python3 scripts/tests/release-gate-test.py
          bash scripts/tests/package-hooks-smoke.sh

      # Каждая закрепленная сумма sing-box — и тех машин, где CI его не берет, — сверена здесь второй раз.
      - name: Суммы sing-box на второй машине
        run: scripts/check-singbox-sums.sh

  build-test:
    name: Сборка и тесты (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Новейший SDK 10.0 по global.json. Свежий выпуск бывает уже объявлен, а файлы у Microsoft еще не готовы
      # (ответ 409 на всех ОС, 2026-10-25), — тогда предыдущий выпуск: global.json берет любой 10.0.
      - id: dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        continue-on-error: true
        with:
          global-json-file: global.json

      - if: steps.dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.402

      - name: Сборка
        id: build
        run: dotnet build PrivateGateway.slnx -c Release

      # Ядро Xray для прокси-теста на localhost (desktop/tests/Network): версия и SHA-256 — в shared/cores.
      - name: Ядро Xray
        shell: bash
        run: scripts/get-xray.sh

      # sing-box — TUN режима VPN (отдельный процесс, GPL-3.0): версия и SHA-256 — в shared/cores.
      - name: TUN sing-box
        shell: bash
        run: scripts/get-singbox.sh

      # Каждый запуск тестов пишет отчет CTRF в artifacts/test-results: по ним последний шаг считает итог и пропуски.
      - name: Тесты
        run: dotnet test --solution PrivateGateway.slnx -c Release --no-build --results-directory artifacts/test-results --report-ctrf

      # На Linux хранилища секретов без рабочего стола нет — поднимаем GNOME Keyring в своей сессии.
      - name: Хранилище секретов Linux (Secret Service)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring libsecret-1-0 dbus
          dbus-run-session -- scripts/tests/secret-service.sh -c Release --no-build --results-directory artifacts/test-results --report-ctrf

      # Тесты в своих сетевых пространствах Linux (TUN sing-box, nftables, блок при обрыве, systemd-creds) — от root:
      # без него они пропускаются. Правила и TUN ставятся только внутри своих пространств, машина CI их не видит.
      # После остальных тестов: файлы результатов от root не мешают шагам без него.
      - name: Сетевые пространства Linux (root)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables
          sudo env "PATH=$PATH" "DOTNET_ROOT=$DOTNET_ROOT" "HOME=$HOME" DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 \
            dotnet test --project desktop/tests/Network -c Release --no-build --results-directory artifacts/test-results --report-ctrf -- \
            --filter-class '*.VpnTunnelTests' --filter-class '*.VpnModeTests' --filter-class '*.KillSwitchTests' \
            --filter-class '*.RouteTableTests' --filter-class '*.BootConnectionTests' --filter-class '*.NetworkNamespaceTests' \
            --filter-class '*.PlatformContractTests' --filter-class '*.RelayTests'

      # Служба launchd на macOS — от root: ставится по-настоящему и удаляется (машина CI одноразовая); pf — правила разных
      # политик грузятся в свой якорь, который основные правила не вызывают (сеть машины CI не закрывается); DNS — на своей
      # записи сети, которой нет в порядке служб (DNS машины CI не меняется); системный прокси — снимок и возврат его же
      # (прокси машины CI не включается); Связка ключей — шифрование подключения при загрузке ключом в системной Связке
      # ключей (запись своего имени тест удаляет). Служба из папки
      # сборки — на общей среде .NET, а launchd запускает ее без DOTNET_ROOT: путь к среде — в /etc/dotnet/install_location,
      # как у установщика .NET (выпуск самодостаточный, ему это не нужно).
      - name: Служба, pf, DNS, прокси и Связка ключей macOS (root)
        if: runner.os == 'macOS'
        run: |
          dotnet_root=${DOTNET_ROOT:-$(dirname "$(readlink -f "$(command -v dotnet)")")}
          sudo mkdir -p /etc/dotnet
          echo "$dotnet_root" | sudo tee /etc/dotnet/install_location > /dev/null
          sudo env "PATH=$PATH" "DOTNET_ROOT=$dotnet_root" "HOME=$HOME" DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 \
            dotnet test --project desktop/tests/Network -c Release --no-build --results-directory artifacts/test-results --report-ctrf -- \
            --filter-class '*.ServiceSetupTests' --filter-class '*.PfKillSwitchTests' --filter-class '*.ScutilDnsTests' \
            --filter-class '*.NetworksetupSystemProxyTests' --filter-class '*.KeychainSealerTests' --filter-class '*.BootConnectionTests' \
            --filter-class '*.PlatformContractTests'

      # Итог всех запусков в сводку задания: упавшие и пропущенные — каждый с причиной. Пропуск, не разрешенный для этой ОС в
      # desktop/tests/allowed-skips.json, роняет проверку: тест не может тихо перестать идти в CI.
      - name: Отчет о тестах и пропусках
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run scripts/test-report.cs artifacts/test-results

  # Linux на ARM и Mac с Intel: выпуска для них нет, а сборка из исходников (docs/user/guide.md) — есть. Здесь — сборка, оба
  # ядра по закрепленным суммам этих машин и тесты, которые гоняют настоящие ядра: прокси через Xray, конфиги эталонов,
  # ретранслятор sing-box, замер задержки (решение 479); на Linux ARM еще хранилище секретов и туннель ретранслятора от
  # root. Остальное с правами root (блок при обрыве, служба) — в основном задании на тех же ОС.
  other-cpu:
    name: Другие процессоры (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - id: dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        continue-on-error: true
        with:
          global-json-file: global.json

      - if: steps.dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.402

      - name: Сборка
        id: build
        run: dotnet build PrivateGateway.slnx -c Release

      - name: Ядро Xray
        run: scripts/get-xray.sh

      - name: Ядро sing-box
        run: scripts/get-singbox.sh

      - name: Тесты
        run: |
          dotnet test --project desktop/tests/Unit -c Release --no-build --results-directory artifacts/test-results --report-ctrf
          dotnet test --project desktop/tests/Network -c Release --no-build --results-directory artifacts/test-results --report-ctrf -- \
            --filter-class '*.XrayProxyTests' --filter-class '*.ReferenceConfigTests' --filter-class '*.RelayTests' \
            --filter-class '*.LatencyProbeTests' --filter-class '*.LocalPortTests'

      # Как в основном задании: хранилище секретов Linux — в своей сессии GNOME Keyring, туннель ретранслятора — от root в
      # своем сетевом пространстве (TUN sing-box этой машины на настоящем пути трафика).
      - name: Хранилище секретов Linux (Secret Service)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring libsecret-1-0 dbus
          dbus-run-session -- scripts/tests/secret-service.sh -c Release --no-build --results-directory artifacts/test-results --report-ctrf

      - name: Туннель ретранслятора в сетевом пространстве Linux (root)
        if: runner.os == 'Linux'
        run: |
          sudo env "PATH=$PATH" "DOTNET_ROOT=$DOTNET_ROOT" "HOME=$HOME" DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 \
            dotnet test --project desktop/tests/Network -c Release --no-build --results-directory artifacts/test-results --report-ctrf -- \
            --filter-class '*.RelayTests'

      - name: Отчет о тестах и пропусках
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run scripts/test-report.cs artifacts/test-results

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # JDK 21: Gradle и AGP идут и на 17, а Robolectric с Android 15 (SDK 35) — только на 21.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties

      # Ядро той же версии, что в libXray телефонов (Xray-core из go.mod закрепленного коммита, scripts/get-xray-mobile.sh):
      # конфиги ядра на эталонных ссылках читает оно само (ReferenceConfigTest). Кешируется по коммиту libXray и скрипту и
      # сохраняется сразу после сборки.
      - id: xray-mobile
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/cores/xray-mobile
          key: xray-mobile-${{ runner.os }}-${{ hashFiles('android/libxray.version', 'scripts/get-xray-mobile.sh') }}

      - if: steps.xray-mobile.outputs.cache-hit != 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false

      - name: Xray libXray для проверки конфигов
        if: steps.xray-mobile.outputs.cache-hit != 'true'
        run: scripts/get-xray-mobile.sh

      - if: steps.xray-mobile.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/cores/xray-mobile
          key: ${{ steps.xray-mobile.outputs.cache-primary-key }}

      # Общий модуль (разбор ссылок и подписок на эталонах shared/testdata, конфиг ядра) и генераторы темы и текстов —
      # без SDK Android: так же их гоняют локально (android/gradlew -p android/core test). Без Xray libXray тест конфигов
      # здесь падает, а не пропускается.
      - name: Общий модуль и генераторы ресурсов
        env:
          PG_REQUIRE_XRAY_MOBILE: "1"
        run: |
          android/gradlew -p android/core test
          android/gradlew -p android/build-logic test

      # Ядро — libXray из исходников закрепленного коммита (android/libxray.version) через gomobile; NDK — с машины CI.
      # Готовый .aar кешируется по коммиту и скрипту: сборка всех четырех ABI идет минуты.
      # Сохраняется сразу после сборки, а не в конце задания: упавшая дальше сборка приложения не заставит собирать ядро
      # заново.
      - id: libxray
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: android/app/libs/libXray.aar
          key: libxray-${{ hashFiles('android/libxray.version', 'scripts/get-libxray.sh') }}

      - if: steps.libxray.outputs.cache-hit != 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false

      - name: Ядро libXray (gomobile)
        if: steps.libxray.outputs.cache-hit != 'true'
        run: scripts/get-libxray.sh

      - if: steps.libxray.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: android/app/libs/libXray.aar
          key: ${{ steps.libxray.outputs.cache-primary-key }}

      # Приложение: сборка APK (подпись отладочным ключом), тесты без устройства (Robolectric: хранилище, тексты RU/EN,
      # экраны Compose) и Android Lint — его ошибки роняют проверку.
      - name: Сборка, тесты и Lint приложения
        run: android/gradlew -p android --continue :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug

      # Схемы базы (Room) лежат в git: по ним MigrationTestHelper проверяет миграции. Схема, которую сборка выгрузила, а
      # в git ее нет, — печатается (положить в git); схема в git, которая разошлась с сущностями, — ошибка: базу поменяли
      # без новой версии и миграции. Сверка — по содержанию JSON: отступы и перевод строки в конце не в счет.
      - name: Схемы базы в git
        if: ${{ !cancelled() }}
        run: |
          changed=""
          for f in $(git ls-files --modified -- android/app/schemas); do
            python3 -c 'import json, subprocess, sys
          f = sys.argv[1]
          sys.exit(json.loads(subprocess.check_output(["git", "show", "HEAD:" + f])) != json.load(open(f)))' "$f" || changed="$changed $f"
          done
          added=$(git ls-files --others --exclude-standard -- android/app/schemas)
          for f in $added $changed; do echo "== $f"; cat "$f"; echo; done
          if [ -n "$added" ]; then echo "::warning::Новая схема базы — положите в git: $added"; fi
          if [ -n "$changed" ]; then echo "::error::Схема базы в git разошлась с сущностями: $changed"; exit 1; fi

      # SBOM (CycloneDX) — тот, что лежит в APK (assets/sbom.cdx.json), рядом с ним в артефакте: состав приложения для
      # проверки уязвимостей без распаковки.
      - name: SBOM из APK
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          for apk in android/app/build/outputs/apk/debug/*.apk; do
            unzip -p "$apk" assets/sbom.cdx.json > "${apk%.apk}.cdx.json"
            python3 -c 'import json, sys; bom = json.load(open(sys.argv[1])); print(sys.argv[1], len(bom["components"]), "компонентов")' "${apk%.apk}.cdx.json"
          done

      - name: APK и отчеты
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.cdx.json
            android/app/build/reports/
            android/app/schemas/
          if-no-files-found: ignore

  # Настоящий туннель на эмуляторе (пункт 9.4): VpnService, ядро libXray и сервер Xray на машине CI
  # (scripts/android-test-server.sh). Ускорение эмулятора — KVM машины GitHub.
  android-emulator:
    name: Android (эмулятор)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties

      # libXray — из кеша задания «Android» (оно идет раньше и собирает ядро при промахе).
      - id: libxray
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: android/app/libs/libXray.aar
          key: libxray-${{ hashFiles('android/libxray.version', 'scripts/get-libxray.sh') }}

      - if: steps.libxray.outputs.cache-hit != 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false

      - name: Ядро libXray (gomobile)
        if: steps.libxray.outputs.cache-hit != 'true'
        run: scripts/get-libxray.sh

      - name: Сервер проверки туннеля (Xray и HTTP на машине CI)
        run: |
          scripts/get-xray.sh
          scripts/android-test-server.sh

      - name: Проверки на эмуляторе (Android 14)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: android/gradlew -p android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.requireTunnelServer=true

      # Отчет лежит в артефакте, но не всякая среда может его скачать — упавшие проверки с ошибкой сразу в журнал задания.
      - name: Упавшие проверки на эмуляторе
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET
          for path in glob.glob('android/app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for problem in case.findall('failure') + case.findall('error'):
                      print(f"УПАЛО: {case.get('classname')}.{case.get('name')}")
                      print('\n'.join((problem.text or problem.get('message') or '').splitlines()[:60]))
          EOF
          tail -n 40 artifacts/android-test-server/*.log 2>/dev/null || true

      - name: Отчеты и журнал сервера
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-emulator
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            artifacts/android-test-server/*.log
          if-no-files-found: ignore

  # iOS (этап 10): общий модуль Swift — разбор ссылок и подписок на эталонах shared/testdata, как у десктопа и Android.
  # Пакет без UIKit и NetworkExtension, поэтому идет и на Linux (Swift есть в образе машины CI), и на macOS (Swift из Xcode).
  ios-core:
    name: iOS — общий модуль (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Swift
        run: swift --version

      # Ядро той же версии, что в libXray телефонов (Xray-core из go.mod закрепленного коммита, scripts/get-xray-mobile.sh):
      # конфиги ядра на эталонных ссылках читает оно само (ReferenceConfigTests). Кешируется по коммиту libXray и скрипту и
      # сохраняется сразу после сборки.
      - id: xray-mobile
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/cores/xray-mobile
          key: xray-mobile-${{ runner.os }}-${{ hashFiles('android/libxray.version', 'scripts/get-xray-mobile.sh') }}

      - if: steps.xray-mobile.outputs.cache-hit != 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false

      - name: Xray libXray для проверки конфигов
        if: steps.xray-mobile.outputs.cache-hit != 'true'
        run: scripts/get-xray-mobile.sh

      - if: steps.xray-mobile.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/cores/xray-mobile
          key: ${{ steps.xray-mobile.outputs.cache-primary-key }}

      # Public-looking alias локального origin: проверка обхода URLSession по результату DNS, включая redirect.
      # Только одноразовый Mac задания; продукт не делает lookup адреса подписки ради preflight.
      - name: Alias loopback для проверки обязательного прокси
        if: runner.os == 'macOS'
        run: printf '%s\n' '127.0.0.1 pg-subscription-loopback.example.test' | sudo tee -a /etc/hosts > /dev/null

      # Без Xray libXray тест конфигов здесь падает, а не пропускается.
      - name: Сборка и тесты
        env:
          PG_REQUIRE_XRAY_MOBILE: "1"
        run: swift test --package-path ios/Core

  # iOS (этап 10): приложение SwiftUI и расширение Packet Tunnel — проект из ios/project.yml (XcodeGen), сборка без
  # подписи и тесты на симуляторе iPhone. Туннель на симуляторе не поднять — он проверяется на iPhone, когда будет аккаунт.
  ios-app:
    name: iOS — приложение (симулятор)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Xcode
        run: xcodebuild -version

      # Ядро — тот же коммит libXray, что у Android (android/libxray.version), через gomobile для iPhone и симулятора.
      # Готовый .xcframework кешируется по коммиту и скрипту и сохраняется сразу после сборки.
      - id: libxray
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ios/Frameworks
          key: libxray-ios-${{ hashFiles('android/libxray.version', 'scripts/get-libxray-ios.sh') }}

      - if: steps.libxray.outputs.cache-hit != 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false

      - name: Ядро libXray (gomobile)
        if: steps.libxray.outputs.cache-hit != 'true'
        run: scripts/get-libxray-ios.sh

      - if: steps.libxray.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ios/Frameworks
          key: ${{ steps.libxray.outputs.cache-primary-key }}

      - name: Alias loopback для проверки обязательного прокси
        run: printf '%s\n' '127.0.0.1 pg-subscription-loopback.example.test' | sudo tee -a /etc/hosts > /dev/null

      - name: Сборка и тесты на симуляторе
        run: scripts/ios-test.sh

  worktree:
    name: Рабочие папки агентов (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # На Windows — Git Bash: скрипты проекта запускаются в нем (AGENTS.md).
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: scripts/worktree.sh на временном репозитории
        run: scripts/tests/worktree-smoke.sh

      - name: Загрузка ядер — докачка после обрыва (scripts/download.sh)
        run: scripts/tests/download-smoke.sh

  secrets:
    name: Секреты в репозитории
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
