name: Сборка выпуска

# Выпуск для трех ОС (scripts/publish.sh): окно и служба с .NET в комплекте, ядра с закрепленными суммами, SBOM
# (CycloneDX) и SHA256SUMS, пакеты Linux и MSI; смоуки проверяют архив и ставят и удаляют пакеты. Из release.yml (тег v*)
# — с версией тега, по кнопке — с любой; на ветках — когда меняется сама сборка. Подпись артефактов — «Отложено».
on:
  # Выпуск по тегу v* собирает release.yml — он вызывает этот workflow и публикует его сборки.
  workflow_call:
  push:
    branches: ['**']
    paths:
      - scripts/publish.sh
      - scripts/package.cs
      - scripts/get-xray.sh
      - scripts/get-singbox.sh
      - scripts/tests/release-smoke.sh
      - scripts/package-linux.sh
      - scripts/package-windows.sh
      - scripts/tests/windows-installer-smoke.sh
      - .github/workflows/release.yml
      - scripts/tests/linux-package-smoke.sh
      - desktop/packaging/**
      - shared/specifications/icons/**
      - shared/cores/**
      - shared/licenses/**
      - Directory.Build.props
      - Directory.Packages.props
      - '**/*.csproj'
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      version:
        description: Версия (SemVer); пусто — из Directory.Build.props
        default: ''

permissions:
  contents: read

jobs:
  publish:
    name: Выпуск (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    defaults:
      run:
        # На Windows — Git Bash: скрипты проекта запускаются в нем (AGENTS.md).
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # Как в проверке: свежий выпуск SDK бывает объявлен раньше, чем готовы файлы, — тогда предыдущий.
      - id: dotnet
        uses: actions/setup-dotnet@v5
        continue-on-error: true
        with:
          global-json-file: global.json

      - if: steps.dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.402

      - name: Версия
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}
          elif [ -n "$INPUT" ]; then version=$INPUT
          else version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Сборка выпуска
        run: scripts/publish.sh "${{ steps.version.outputs.version }}"

      - name: Проверка выпуска из архива
        run: scripts/tests/release-smoke.sh "${{ steps.version.outputs.version }}"

      # Пакеты Linux — nfpm закрепленной версии (модуль сверяется по sum.golang.org), затем настоящая установка и удаление
      # на этой машине: машина CI одноразовая, служба и таблица блока при обрыве с нее никуда не уходят.
      - if: runner.os == 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Пакеты Linux (.deb, .rpm)
        if: runner.os == 'Linux'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          PATH="$(go env GOPATH)/bin:$PATH" scripts/package-linux.sh "${{ steps.version.outputs.version }}"

      - name: Установка и удаление .deb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils nftables
          scripts/tests/linux-package-smoke.sh "${{ steps.version.outputs.version }}"

      # Установщик Windows — WiX 5.0.2 (MS-RL) глобальным инструментом dotnet, затем настоящая установка и удаление на этой
      # машине (одноразовой): служба, папки, ярлык, запись в «Установленных приложениях».
      - name: Установщик Windows (MSI)
        if: runner.os == 'Windows'
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool install --global wix --version 5.0.2
          export PATH="$HOME/.dotnet/tools:$PATH"
          wix extension add --global WixToolset.Util.wixext/5.0.2
          scripts/package-windows.sh "${{ steps.version.outputs.version }}"

      - name: Установка и удаление MSI
        if: runner.os == 'Windows'
        run: scripts/tests/windows-installer-smoke.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: artifacts/release/
          if-no-files-found: error
