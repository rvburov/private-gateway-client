name: Выпуск на GitHub

# Тег v<SemVer> (ставит scripts/release.sh, как в SmartBase) → тег на master, версия и секция в CHANGELOG.md, зеленая
# проверка CI этого коммита (ждем ее конца) → долгий прогон на этом коммите и сборки трех ОС → выпуск на GitHub
# (scripts/release.cs): файлы ОС, общий SHA256SUMS, манифест обновления update.json с подписью update.json.sig (ключ —
# секрет UPDATE_SIGNING_KEY); текст страницы — scripts/release-notes.sh из секции версии в CHANGELOG.md, без списка
# коммитов. Выпуск уже есть (повтор запуска) — текст и файлы заменяются. Версия с «-» — бета: выпуск помечен prerelease,
# канал beta, раскатка 100 %. Стабильный выпуск раскатывается поэтапно: сначала 20 %, дальше — release-rollout.yml.
# К выпуску прикладывается приложение Android (APK, подписанный ключом выпуска из секретов; ставится вручную, «из
# неизвестных источников»). Apple (iOS) — «в разработке»: сборки нет до аккаунта Apple Developer.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: Условия выпуска
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Версия тега, Directory.Build.props и секция в CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/check-version.sh "${RELEASE_TAG#v}"

      # Тег ставится сразу после коммита «release: vX.Y.Z», и его проверка CI в этот момент еще идет: ждем ее конца.
      - name: Точный коммит тега, master и основная проверка
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch origin master
          python3 scripts/release-gate.py "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$RELEASE_SHA" --wait 120

  # Долгий прогон именно коммита тега (30 минут на режим), параллельно со сборками.
  soak:
    name: Долгий прогон
    needs: gate
    uses: ./.github/workflows/soak.yml
    with:
      minutes: '30'

  build:
    name: Сборки
    needs: gate
    uses: ./.github/workflows/publish.yml

  android:
    name: Android (APK)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties

      # Ядро libXray — тот же закрепленный коммит и кеш, что в ci.yml.
      - id: libxray
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: android/app/libs/libXray.aar
          key: libxray-${{ hashFiles('android/libxray.version', 'scripts/get-libxray.sh') }}

      - if: steps.libxray.outputs.cache-hit != 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false

      - name: Ядро libXray (gomobile)
        if: steps.libxray.outputs.cache-hit != 'true'
        run: scripts/get-libxray.sh

      # APK подписан ключом выпуска пользователя из секретов (docs/operations/android-signing.md): нет ключа — выпуск
      # останавливается, отладочный APK не выкладывается.
      - name: APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/android-release-apk.sh "${GITHUB_REF_NAME#v}" artifacts/android

      - name: Установщик Android — только APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-Android-${{ github.ref_name }}
          path: artifacts/android/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: artifacts/android/

  release:
    name: Выпуск
    needs: [gate, soak, build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - id: dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        continue-on-error: true
        with:
          global-json-file: global.json

      - if: steps.dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.402

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: artifacts/builds

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-apk
          path: artifacts/android

      # За время сборки тег или результат повторной проверки могли измениться. Не подписываем старое доказательство.
      - name: Повторная проверка перед подписью
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          # «+»: checkout кладет тег простой ссылкой на коммит, а release.sh ставит аннотированный — без «+» git отказывается
          # заменить одно другим («would clobber existing tag»; так остановился выпуск 0.1.5). Сдвинутый тег ловит
          # release-gate.py, сравнивая коммит тега с исходным SHA.
          git fetch origin master "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python3 scripts/release-gate.py "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$RELEASE_SHA"

      - name: Файлы, суммы, манифест, подпись и заметки
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Тег $GITHUB_REF_NAME — не v<SemVer>" >&2; exit 1; }
          rollout=20
          [[ "$version" != *-* ]] || rollout=100
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) dotnet run scripts/release.cs assemble "$version" artifacts/builds artifacts/release "$rollout"
          cp artifacts/android/* artifacts/release/
          scripts/release-notes.sh "$version" artifacts/release > artifacts/notes.md

      # Как в SmartBase: выпуск уже есть (повтор запуска после сбоя на этом шаге) — заменить текст и файлы, а не падать.
      - name: Выпуск на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          prerelease=false
          [[ "$version" != *-* ]] || prerelease=true
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Private Gateway $version" --notes-file artifacts/notes.md \
              --prerelease="$prerelease"
            gh release upload "$GITHUB_REF_NAME" artifacts/release/* --clobber
          else
            flags=()
            [ "$prerelease" = false ] || flags=(--prerelease)
            gh release create "$GITHUB_REF_NAME" artifacts/release/* --verify-tag --title "Private Gateway $version" \
              --notes-file artifacts/notes.md "${flags[@]}"
          fi
          gh release view "$GITHUB_REF_NAME" --json url --jq .url
