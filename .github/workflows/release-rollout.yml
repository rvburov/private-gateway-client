name: Раскатка выпуска

# Доля раскатки опубликованного выпуска (update.json, его новая подпись — ключ из секрета UPDATE_SIGNING_KEY — и их
# строки в SHA256SUMS). Клиент берет выпуск, только если его номер из 0–99 меньше доли. Выпуск выходит сразу на 100 %
# (решение владельца 2026-11-13), поэтому кнопка — прежде всего стоп-кран: 0 % — выпуск больше никому не предлагается;
# вернуть 100 % или дать долю меньше — так же.
# Программа берет обновления с сайта, поэтому новая доля сразу уходит и туда: задание «Сайт — новая доля» вызывает
# website.yml только с манифестом (update.json.sig и update.json этого выпуска на GitHub). Оно красное — у программ
# прежняя доля: Re-run failed jobs. Две раскатки идут по очереди: доля на GitHub и на сайте — от последней.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Тег выпуска (v1.2.3)
        required: true
      rollout:
        description: Доля, % (1–100; 0 — остановить раскатку)
        required: true
        default: '100'

permissions:
  contents: write

concurrency:
  group: release-rollout
  cancel-in-progress: false

jobs:
  rollout:
    name: Раскатка
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - id: dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        continue-on-error: true
        with:
          global-json-file: global.json

      - if: steps.dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.402

      - name: Новая доля
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAG: ${{ inputs.tag }}
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Тег $TAG — не v<SemVer>" >&2; exit 1; }
          mkdir -p artifacts/published
          gh release download "$TAG" --pattern 'update.json*' --pattern SHA256SUMS --dir artifacts/published
          dotnet run scripts/release.cs rollout artifacts/published "$ROLLOUT"
          gh release upload "$TAG" artifacts/published/* --clobber

  # Новая доля — на сайт: оттуда ленту берут программы. Бету и выпуск без подписи website.yml пропускает сам.
  website:
    name: Сайт — новая доля
    needs: rollout
    permissions:
      contents: read
    uses: ./.github/workflows/website.yml
    with:
      tag: ${{ inputs.tag }}
      manifest-only: true
    secrets:
      WEBSITE_HOST: ${{ secrets.WEBSITE_HOST }}
      WEBSITE_USER: ${{ secrets.WEBSITE_USER }}
      WEBSITE_SSH_KEY: ${{ secrets.WEBSITE_SSH_KEY }}
      WEBSITE_KNOWN_HOSTS: ${{ secrets.WEBSITE_KNOWN_HOSTS }}
