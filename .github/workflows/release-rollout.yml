name: Раскатка выпуска

# Поэтапное обновление: новая доля раскатки опубликованного выпуска (update.json и его строка в SHA256SUMS). Клиент
# берет выпуск, только если его номер из 0–99 меньше доли. Обычный путь стабильного выпуска: 20 % → 50 % → 100 %.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Тег выпуска (v1.2.3)
        required: true
      rollout:
        description: Доля, % (1–100)
        required: true
        default: '100'

permissions:
  contents: write

jobs:
  rollout:
    name: Раскатка
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v5

      - id: dotnet
        uses: actions/setup-dotnet@v5
        continue-on-error: true
        with:
          global-json-file: global.json

      - if: steps.dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.402

      - name: Новая доля
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Тег $TAG — не v<SemVer>" >&2; exit 1; }
          mkdir -p artifacts/published
          gh release download "$TAG" --pattern update.json --pattern SHA256SUMS --dir artifacts/published
          dotnet run scripts/release.cs rollout artifacts/published "$ROLLOUT"
          gh release upload "$TAG" artifacts/published/update.json artifacts/published/SHA256SUMS --clobber
