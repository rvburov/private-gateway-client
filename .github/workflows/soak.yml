name: Долгий прогон

# Soak: сбои по кругу, сторож обхода туннеля и замер ресурсов (scripts/soak.sh) — каждую ночь, по кнопке и в выпуске
# (release.yml гоняет его на коммите своего тега). Режим прокси —
# на трех ОС, режим VPN — на Linux от root в своем сетевом пространстве и на Windows (машина CI — администратор) с туннелем
# только на адрес теста. В обычную проверку не входит: минуты на круг.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: Минут на каждый режим (30–60)
        default: '30'
  workflow_call:
    inputs:
      minutes:
        description: Минут на каждый режим (30–60)
        type: string
        default: '30'

permissions:
  contents: read
  actions: read

jobs:
  # Ночной запуск на коммите, который уже прошел долгий прогон, ничего нового не скажет, а минуты macOS идут с множителем 10
  # (закрытый репозиторий — решение 732). По кнопке и в выпуске прогон идет всегда.
  need:
    name: Нужен ли прогон
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run=true
          if [ "$EVENT" = schedule ]; then
            passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/soak.yml/runs?head_sha=$SHA&status=success&per_page=1" \
              --jq '.total_count' || echo 0)"
            if [ "${passed:-0}" != 0 ]; then
              run=false
              echo "Коммит ${SHA:0:12} уже прошел долгий прогон — ночью он не повторяется." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  soak:
    name: Долгий прогон (${{ matrix.os }})
    needs: need
    if: needs.need.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS проходит за 35–60 минут; зависший прогон снимается раньше, чем на других ОС (минута macOS — за десять).
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 90 || 150 }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      MINUTES: ${{ inputs.minutes || '30' }}
    defaults:
      run:
        # На Windows — Git Bash: скрипты проекта запускаются в нем (AGENTS.md).
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Как в проверке: свежий выпуск SDK бывает объявлен раньше, чем готовы файлы, — тогда предыдущий.
      - id: dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        continue-on-error: true
        with:
          global-json-file: global.json

      - if: steps.dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.402

      # dotnet build готовит службу macOS и собирает закрепленный sing-box из исходников.
      - name: Go для ядра macOS
        if: runner.os == 'macOS'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false

      - name: Сборка
        run: dotnet build PrivateGateway.slnx -c Release

      - name: Ядра Xray и sing-box
        run: |
          scripts/get-xray.sh
          scripts/get-singbox.sh

      - name: nftables
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables

      # Стеки зависшего режима прокси (scripts/soak.sh под soak-watchdog.py на macOS и Linux): только потоки, без дампа памяти.
      # Официальный пакет Microsoft, MIT: NuGet dotnet-stack/10.0.750501 — тот же, что в macos-soak-debug.yml.
      - name: Средство чтения стеков
        if: runner.os != 'Windows'
        run: |
          dotnet tool install dotnet-stack --version 10.0.750501 \
            --tool-path "$RUNNER_TEMP/dotnet-tools" --allow-roll-forward
          echo "PG_SOAK_STACK_TOOL=$RUNNER_TEMP/dotnet-tools/dotnet-stack" >> "$GITHUB_ENV"

      - name: Долгий прогон
        run: |
          [[ "$MINUTES" =~ ^[0-9]+$ ]] && [ "$MINUTES" -ge 30 ] && [ "$MINUTES" -le 60 ] \
            || { echo "Для выпускного прогона требуется от 30 до 60 минут на режим" >&2; exit 1; }
          scripts/soak.sh "$MINUTES"

      # Этапы, стеки и полный вывод режима прокси — только при сбое: по ним ищется место зависания (soak.md).
      - name: Этапы и стеки режима прокси
        if: failure() && runner.os != 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soak-${{ matrix.os }}-${{ github.run_attempt }}
          path: artifacts/soak/
          if-no-files-found: warn
          retention-days: 7
