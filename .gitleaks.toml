# Настройка gitleaks (CI, задача «Секреты в репозитории»): все правила по умолчанию плюс узкие
# исключения для строк, которые похожи на ключ только формой (решение агента №47, одобрено
# пользователем). Исключение — по всей строке и по точному шаблону; новое добавлять так же, с
# объяснением. Формат [allowlist] понимают и gitleaks из пакетов ОС, и версия в CI.

[extend]
useDefault = true

[allowlist]
description = "Строки, похожие на ключ только формой"
regexTarget = "line"
regexes = [
  # Имена ресурсов Avalonia: x:Key="PgBrush.Status.Success.Tint" — правило generic-api-key
  # видит «Key="» и длинную строку с точками.
  '''x:Key="[A-Za-z][A-Za-z0-9]*(\.[A-Za-z0-9]+)+"''',
  # Шапка Tokens.axaml: SHA-256 файла design-tokens.json, по нему тест ловит несобранную тему.
  '''tokens-sha256: [0-9a-f]{64}''',
  # Имя системной библиотеки Secret Service в LibsecretSecretStore: «Secret» в имени константы.
  '''const string LibSecret = "libsecret-1\.so\.0";''',
]
